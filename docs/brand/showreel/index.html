      function s6(t) {
        bg(C.indigo);
        const c = cam6(t);
        const sh = shake(t, [b(36), b(44)], 16);
        cam(c.x - sh.x, c.y - sh.y, c.z);

        // the board arrives from an isometric plane, then turns over into the workbook
        const ea = E.back(clamp((t - b(36.75)) / b(1.5)));
        const flip = clamp((t - b(48.5)) / b(0.75));
        const sx = Math.abs(Math.cos(Math.PI * E.inout(flip)));
        const pages = flip >= 0.5;
        if (t >= b(36.75) && !pages) {
          ctx.save();
          ctx.translate(DL.px + DL.pw / 2, DL.py + DL.ph / 2);
          ctx.scale(sx, 1);
          ctx.scale(1, lerp(0.5, 1, ea));
          ctx.rotate(lerp(-0.62, 0, ea));
          const s = lerp(0.35, 1, ea);
          ctx.scale(s, s);
          ctx.translate(-DL.pw / 2, -DL.ph / 2);
          dashboard(t);
          ctx.restore();
        }
        if (pages) {
          const fanX = PORTRAIT ? 120 : 300;
          const pcy = PORTRAIT ? CY - 90 : 470;
          const ps = PORTRAIT ? 0.86 : 1;
          PAGES.forEach((pg, i) => {
            const fan = E.back(clamp((t - b(49.25) - b(0.25) * i) / 0.35));
            ctx.save();
            ctx.translate(
              CX + (i - 1.5) * fanX * fan,
              pcy + Math.abs(i - 1.5) * 26 * fan,
            );
            ctx.rotate((i - 1.5) * (PORTRAIT ? 0.1 : 0.09) * fan);
            ctx.scale(ps * (i === 0 ? Math.max(sx, fan) : fan), ps * (i === 0 ? 1 : fan));
            if (i === 0 || fan > 0) page(pg);
            ctx.restore();
          });
          // the workbook goes out as a file
          const btn = E.back(clamp((t - b(50)) / 0.3));
          if (btn > 0) {
            const press = 1 - 0.06 * bump(t, b(50.75), 0.16);
            ctx.save();
            ctx.translate(CX, PORTRAIT ? CY + 360 : 905);
            ctx.scale(btn * press, btn * press);
            ctx.fillStyle = C.ink;
            rr(-230, -44, 460, 88, 44);
            ctx.fill();
            setFont(30, 600, BODY);
            ctx.fillStyle = C.white;
            ctx.textAlign = "center";
            ctx.fillText(
              t >= b(50.9) ? "✓  MIS · March 2026.xlsx" : "↓  Download workbook",
              0,
              11,
            );
            ctx.restore();
          }
        }
        reset();

        // headline, then the caption it becomes
        if (t < b(37)) {
          const s2 = shake(t, [b(36)], 20);
          if (PORTRAIT) {
            slam("A clean", CX + s2.x, CY - 30 + s2.y, 180, t, b(36), { color: C.white });
            slam("dashboard.", CX + s2.x, CY + 150 + s2.y, 180, t, b(36), {
              color: C.white,
            });
          } else
            slam("A clean dashboard.", CX + s2.x, 600 + s2.y, 168, t, b(36), {
              color: C.white,
            });
        }
        const cur = CAPTIONS.filter((k) => t >= b(k.at)).pop();
        if (cur) {
          const cap = PORTRAIT
            ? { y: H - 250, h: 110, size: 48, x: 64 }
            : { y: 900, h: 116, size: 54, x: 76 };
          const into = t < b(37.5) ? E.out(clamp((t - b(37)) / b(0.5))) : 1;
          setFont(cap.size, 600);
          const w = tw(cur.s);
          const bw = (w + cap.x * 2) * E.expo(clamp((t - b(37)) / 0.3));
          ctx.fillStyle = C.ink;
          ctx.fillRect(0, cap.y, bw, cap.h);
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, cap.y, bw, cap.h);
          ctx.clip();
          const prev = CAPTIONS[CAPTIONS.indexOf(cur) - 1];
          const swap = E.expo(clamp((t - b(cur.at)) / 0.34));
          const base = cap.y + cap.h * 0.66;
          ctx.fillStyle = C.white;
          if (prev && swap < 1) ctx.fillText(prev.s, cap.x, base - swap * cap.h);
          ctx.fillText(
            cur.s,
            cap.x,
            base + (prev ? (1 - swap) * cap.h : (1 - into) * cap.h),
          );
          ctx.restore();
        }

        // speed lines on the whip pan
        const v = Math.hypot(
          cam6(t).x - cam6(t - 1 / 60).x,
          cam6(t).y - cam6(t - 1 / 60).y,
        );
        if (v > 12) {
          const r = rng(Math.floor(t * 60));
          ctx.fillStyle = C.white;
          for (let i = 0; i < 26; i++) {
            ctx.globalAlpha = clamp(v / 60) * (0.25 + r() * 0.4);
            ctx.fillRect(r() * W, r() * H, 200 + r() * 600, 3);
          }
          ctx.globalAlpha = 1;
        }
      }

      /* ================================================================ 7 · the half day
       * 52 → 60 beats. "No more spending half a day making Excel look presentable."
       * Ink. "half a day" lands a word a beat, is struck through on beat 58, and its letters
       * fall away. */

      function s7(t) {
        bg(C.ink);
        const x = M;
        const fall = t - b(59);
        const fade = 1 - clamp(fall / 0.25);
        const size = PORTRAIT ? fit("half a day", 290, W - 2 * M, 700, -0.045) : 290;
        const base = PORTRAIT ? CY + 40 : 610;
        words(
          at(["No", "more", "spending"], 52, 0.5),
          x,
          PORTRAIT ? CY - 330 : 300,
          PORTRAIT ? 78 : 84,
          t,
          {
            color: C.white,
            weight: 500,
            alpha: fade,
          },
        );
        // "half a day", letter by letter so the letters can fall
        setFont(size, 700, DISPLAY, -0.045);
        ctx.textAlign = "left";
        const word = "half a day";
        const full = tw(word);
        const r = rng(51);
        for (let i = 0; i < word.length; i++) {
          const ch = word[i];
          if (ch === " ") continue;
          const lx = x + tw(word.slice(0, i));
          const wordIndex = word.slice(0, i).split(" ").length - 1;
          const t0 = b(54 + wordIndex * 0.5);
          if (t < t0) continue;
          const p = E.expo(clamp((t - t0) / 0.22));
          const ft = Math.max(0, fall - r() * 0.12);
          const vy = -300 - r() * 500;
          const dy = vy * ft + 0.5 * 9000 * ft * ft;
          const rot = (r() - 0.5) * 6 * ft;
          ctx.save();
          ctx.translate(lx + cw(ch) / 2, base + dy - 100);
          ctx.rotate(rot);
          ctx.scale(lerp(1.4, 1, p), lerp(1.4, 1, p));
          ctx.globalAlpha = clamp((t - t0) / 0.04) * (t >= b(58.4) ? 0.42 : 1);
          ctx.fillStyle = C.white;
          ctx.fillText(ch, -cw(ch) / 2, 100);
          ctx.restore();
        }
        // the strike
        const strike = E.inout(clamp((t - b(58)) / b(0.6)));
        if (strike > 0 && fall < 0) {
          const th = Math.max(16, size * 0.1);
          ctx.fillStyle = C.indigo5;
          ctx.fillRect(x - 24, base - size * 0.3 - th / 2, (full + 48) * strike, th);
        }
        words(
          at(["making", "Excel", "look", "presentable."], 56, 0.5),
          x,
          PORTRAIT ? CY + 250 : 790,
          PORTRAIT ? 66 : 72,
          t,
          { color: C.lav, weight: 500, alpha: fade, maxW: W - 2 * M },
        );
      }

      /* ================================================================ 8 · the becoming
       * 60 → 68 beats. "Just your data… becoming a decision-ready MIS."
       * Figures scattered across the paper fly, each on its own curve, into the rising line
       * of the mark. */

      const MK = PORTRAIT
        ? { cx: CX, cy: 1200, size: 620 }
        : { cx: 960, cy: 660, size: 540 };
      const PARTICLES = (() => {
        const r = rng(2026);
        const k = MK.size / 64;
        const x0 = MK.cx - MK.size / 2;
        const y0 = MK.cy - MK.size / 2;
        const segs = [];
        let len = 0;
        for (let i = 0; i < MARK.length - 1; i++) {
          const [ax, ay] = MARK[i];
          const [bx, by] = MARK[i + 1];
          const l = Math.hypot(bx - ax, by - ay);
          segs.push({ ax, ay, bx, by, l, from: len });
          len += l;
        }
        const N = 280;
        const cols = [C.n700, C.n500, C.indigo, C.lav];
        const top = PORTRAIT ? 680 : 360;
        return Array.from({ length: N }, (_, i) => {
          const d = ((i + r() * 0.8) / N) * len;
          const s = segs.find((g) => d <= g.from + g.l) ?? segs[segs.length - 1];
          const f = (d - s.from) / s.l;
          const nx = -(s.by - s.ay) / s.l;
          const ny = (s.bx - s.ax) / s.l;
          const j = (r() - 0.5) * 3.2;
          const tx = x0 + (s.ax + (s.bx - s.ax) * f + nx * j) * k;
          const ty = y0 + (s.ay + (s.by - s.ay) * f + ny * j) * k;
          let sx;
          let sy;
          do {
            sx = 50 + r() * (W - 100);
            sy = top + r() * (H - top - 50);
          } while (Math.hypot(sx - tx, sy - ty) < 160);
          return {
            sx,
            sy,
            tx,
            ty,
            ch: String(Math.floor(r() * 10)),
            col: cols[Math.floor(r() * cols.length)],
            pop: b(60) + r() * b(1.5),
            go: b(62) + r() * b(2),
            dur: b(1.2) + r() * b(0.6),
            bend: (r() - 0.5) * 700,
            ph: r() * 6.28,
          };
        });
      })();

      function s8(t) {
        bg(C.paper);
        dotGrid(C.n400, 0.22);
        words(
          at(["Just", "your", "data…"], 60, 0.5),
          CX,
          PORTRAIT ? 380 : 190,
          PORTRAIT ? 80 : 78,
          t,
          {
            align: "center",
            weight: 500,
          },
        );
        words(
          at(
            [
              "becoming",
              "a",
              { s: "decision-ready", nl: PORTRAIT },
              { s: "MIS.", color: C.indigo },
            ],
            63,
            0.5,
          ),
          CX,
          PORTRAIT ? 500 : 290,
          PORTRAIT ? 80 : 78,
          t,
          { align: "center", lead: 1.15 },
        );
        const solid = clamp((t - b(66)) / b(0.75));
        setFont(40, 600, BODY);
        ctx.textAlign = "center";
        for (const p of PARTICLES) {
          if (t < p.pop) continue;
          const appear = E.back(clamp((t - p.pop) / 0.25));
          const q = E.inout(clamp((t - p.go) / p.dur));
          const mx = (p.sx + p.tx) / 2 + (p.ty - p.sy) * (p.bend / 1000);
          const my = (p.sy + p.ty) / 2 - (p.tx - p.sx) * (p.bend / 1000);
          const idle = (1 - q) * 6;
          const x =
            (1 - q) * (1 - q) * p.sx +
            2 * (1 - q) * q * mx +
            q * q * p.tx +
            Math.sin(t * 3 + p.ph) * idle;
          const y =
            (1 - q) * (1 - q) * p.sy +
            2 * (1 - q) * q * my +
            q * q * p.ty +
            Math.cos(t * 2.6 + p.ph) * idle;
          ctx.globalAlpha = (1 - solid) * clamp(1 - q * 1.6) * appear;
          ctx.fillStyle = p.col;
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(appear, appear);
          ctx.fillText(p.ch, 0, 14);
          ctx.restore();
          ctx.globalAlpha = (1 - solid) * clamp(q * 1.6 - 0.2);
          ctx.fillStyle = C.indigo;
          circle(x, y, 15 * q);
        }
        ctx.globalAlpha = 1;
        if (solid > 0)
          mark(MK.cx, MK.cy, MK.size, {
            tile: 0,
            stroke: C.indigo,
            ring: 0,
            strokeAlpha: solid,
          });
      }

      /* ================================================================ 9 · the mark
       * 68 → 76 beats. "Magic MIS. Turn your business data into valuable insights."
       * The tile lands behind the line, the ring pops, the mark slides into its lockup —
       * beside the wordmark in landscape, above it in portrait — and the frame comes to rest:
       * the last second and a half does not move. */

      function s9(t) {
        bg(C.ink);
        const word = "Magic MIS";
        const size = PORTRAIT ? 150 : 168;
        setFont(size, 600, DISPLAY, -0.02);
        const ww = tw(word);
        const lock = PORTRAIT
          ? { cx: CX, cy: CY - 260, tile: 300, tx: CX - ww / 2, base: CY + 110 }
          : (() => {
              const tile = 196;
              const left = CX - (tile + 50 + ww) / 2;
              return {
                cx: left + tile / 2,
                cy: 500,
                tile,
                tx: left + tile + 50,
                base: 500 + size * 0.35,
              };
            })();
        const m = E.inout(clamp((t - b(69.5)) / b(1.25)));
        const sh = shake(t, [b(68)], 18);
        mark(
          lerp(MK.cx, lock.cx, m) + sh.x,
          lerp(MK.cy, lock.cy, m) + sh.y,
          lerp(MK.size, lock.tile, m),
          {
            tile: lerp(0.82, 1, E.back(clamp((t - b(68)) / 0.4))),
            tileColor: C.indigo5,
            ring: E.back(clamp((t - b(68.5)) / 0.35)),
          },
        );

        // the wordmark rises letter by letter, "MIS" in the accent
        setFont(size, 600, DISPLAY, -0.02);
        ctx.textAlign = "left";
        ctx.save();
        ctx.beginPath();
        ctx.rect(lock.tx - 20, lock.base - size * 1.05, ww + 60, size * 1.35);
        ctx.clip();
        for (let i = 0; i < word.length; i++) {
          const p = E.expo(clamp((t - b(70.25) - i * b(0.0625)) / 0.42));
          if (p <= 0) continue;
          ctx.fillStyle = i >= 6 ? C.lavText : C.white;
          ctx.fillText(
            word[i],
            lock.tx + tw(word.slice(0, i)),
            lock.base + (1 - p) * size * 1.2,
          );
        }
        ctx.restore();

        words(
          at(
            [
              "Turn",
              "your",
              "business",
              "data",
              { s: "into", nl: PORTRAIT },
              "valuable",
              "insights.",
            ],
            71,
            0.125,
          ),
          CX,
          lock.base + (PORTRAIT ? 160 : 150),
          46,
          t,
          {
            align: "center",
            fam: BODY,
            weight: 500,
            color: C.muted,
            dur: 0.5,
            lead: 1.4,
          },
        );
      }

      /* ---------------------------------------------------------------- the cut */

      const SCENES = [
        [0, 4, s1],
        [4, 12, s2],
        [12, 20, s3],
        [20, 28, s4],
        [28, 36, s5],
        [36, 52, s6],
        [52, 60, s7],
        [60, 68, s8],
        [68, 76, s9],
      ];
      function render(time) {
        const t = clamp(time, 0, TOTAL);
        reset();
        const beat = t / BEAT;
        const scene =
          SCENES.find(([a, z]) => beat >= a && beat < z) ?? SCENES[SCENES.length - 1];
        scene[2](t);
        reset();
      }

      /* ================================================================ the score
       * 120 BPM in A minor. Every hit above has a sound here on the same beat. Built against
       * any BaseAudioContext, so the recorder renders it offline and the page plays the very
       * same buffer. `T(beat)` is a time on the grid, `D(beats)` a length. */

      const mtof = (n) => 440 * Math.pow(2, (n - 69) / 12);
      const CHORDS = [
        [57, 60, 64],
        [57, 60, 65],
        [55, 60, 64],
        [55, 59, 62],
      ];
      const ROOTS = [45, 41, 48, 43];

      function score(ac) {
        const T = (beat) => beat * BEAT;
        const D = T;
        const r = rng(128);
        const out = ac.createGain();
        out.gain.setValueAtTime(0.8, 0);
        out.gain.setValueAtTime(0.8, T(74));
        out.gain.linearRampToValueAtTime(0.0001, TOTAL - 0.02);
        const comp = ac.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.knee.value = 10;
        comp.ratio.value = 4;
        comp.attack.value = 0.004;
        comp.release.value = 0.14;
        out.connect(comp).connect(ac.destination);

        const lp = ac.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 19000;
        lp.Q.value = 0.9;
        lp.connect(out);
        const drums = ac.createGain();
        drums.gain.value = 0.9;
        drums.connect(lp);
        const duck = ac.createGain();
        duck.connect(lp);
        const fx = ac.createGain();
        fx.gain.value = 0.9;
        fx.connect(out);

        const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const nd = noise.getChannelData(0);
        for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;

        function env(g, t, a, v, d) {
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(v, t + a);
          g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
        }
        function hit(t, dur, type, f, v, dest = drums, q = 0.8, pan = 0) {
          const s = ac.createBufferSource();
          s.buffer = noise;
          const fl = ac.createBiquadFilter();
          fl.type = type;
          fl.frequency.value = f;
          fl.Q.value = q;
          const g = ac.createGain();
          env(g, t, 0.002, v, dur);
          const p = ac.createStereoPanner();
          p.pan.value = pan;
          s.connect(fl).connect(g).connect(p).connect(dest);
          s.start(t, r() * 1.5);
          s.stop(t + dur + 0.05);
        }
        function tone(t, f, dur, v, type = "sine", dest = fx, a = 0.003, pan = 0) {
          const o = ac.createOscillator();
          o.type = type;
          o.frequency.value = f;
          const g = ac.createGain();
          env(g, t, a, v, dur);
          const p = ac.createStereoPanner();
          p.pan.value = pan;
          o.connect(g).connect(p).connect(dest);
          o.start(t);
          o.stop(t + a + dur + 0.05);
        }
        const kicks = [];
        function kick(t, v = 1) {
          const o = ac.createOscillator();
          o.frequency.setValueAtTime(170, t);
          o.frequency.exponentialRampToValueAtTime(52, t + 0.1);
          o.frequency.exponentialRampToValueAtTime(40, t + 0.4);
          const g = ac.createGain();
          env(g, t, 0.003, v, 0.42);
          o.connect(g).connect(drums);
          o.start(t);
          o.stop(t + 0.5);
          hit(t, 0.014, "highpass", 2500, 0.22 * v);
          kicks.push(t);
        }
        const hat = (t, v = 0.1, open = false, pan = 0.25) =>
          hit(t, open ? 0.2 : 0.035, "highpass", open ? 7000 : 9000, v, drums, 0.7, pan);
        function clap(t, v = 0.5) {
          for (let i = 0; i < 3; i++)
            hit(t + i * 0.011, 0.02, "bandpass", 1350, v, drums, 1.4);
          hit(t + 0.03, 0.17, "bandpass", 1200, v * 0.8, drums, 1.1);
        }
        function snare(t, v = 0.3) {
          hit(t, 0.1, "bandpass", 2200, v, drums, 0.9);
          tone(t, 200, 0.06, v * 0.6, "triangle", drums);
        }
        function impact(t, v = 1) {
          const o = ac.createOscillator();
          o.frequency.setValueAtTime(90, t);
          o.frequency.exponentialRampToValueAtTime(28, t + 1.1);
          const g = ac.createGain();
          env(g, t, 0.004, 0.9 * v, 1.2);
          o.connect(g).connect(fx);
          o.start(t);
          o.stop(t + 1.3);
          hit(t, 0.7, "lowpass", 900, 0.5 * v, fx, 0.7);
          hit(t, 1.4, "highpass", 4500, 0.12 * v, fx, 0.7);
        }
        function whoosh(t, dur, up, v = 0.25) {
          const s = ac.createBufferSource();
          s.buffer = noise;
          s.loop = true;
          const fl = ac.createBiquadFilter();
          fl.type = "bandpass";
          fl.Q.value = 1.6;
          fl.frequency.setValueAtTime(up ? 400 : 6000, t);
          fl.frequency.exponentialRampToValueAtTime(up ? 6000 : 400, t + dur);
          const g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(v, t + dur * (up ? 0.85 : 0.2));
          g.gain.linearRampToValueAtTime(0, t + dur);
          s.connect(fl).connect(g).connect(fx);
          s.start(t);
          s.stop(t + dur + 0.02);
        }
        function riser(t0, t1, v = 0.3) {
          whoosh(t0, t1 - t0, true, v);
          const o = ac.createOscillator();
          o.type = "sawtooth";
          o.frequency.setValueAtTime(180, t0);
          o.frequency.exponentialRampToValueAtTime(1600, t1);
          const fl = ac.createBiquadFilter();
          fl.type = "lowpass";
          fl.frequency.setValueAtTime(600, t0);
          fl.frequency.exponentialRampToValueAtTime(5000, t1);
          const g = ac.createGain();
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(v * 0.18, t1 - 0.02);
          g.gain.linearRampToValueAtTime(0, t1);
          o.connect(fl).connect(g).connect(fx);
          o.start(t0);
          o.stop(t1 + 0.02);
        }
        function bass(t, n, dur, v = 0.32) {
          const f = mtof(n);
          const fl = ac.createBiquadFilter();
          fl.type = "lowpass";
          fl.Q.value = 5;
          fl.frequency.setValueAtTime(260, t);
          fl.frequency.linearRampToValueAtTime(1100, t + 0.02);
          fl.frequency.exponentialRampToValueAtTime(300, t + dur);
          const g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(v, t + 0.006);
          g.gain.setValueAtTime(v, t + dur * 0.8);
          g.gain.linearRampToValueAtTime(0, t + dur);
          fl.connect(g).connect(duck);
          for (const [type, mul, lvl] of [
            ["sawtooth", 1, 0.6],
            ["square", 0.5, 0.35],
            ["sine", 0.5, 0.9],
          ]) {
            const o = ac.createOscillator();
            o.type = type;
            o.frequency.value = f * mul;
            const og = ac.createGain();
            og.gain.value = lvl;
            o.connect(og).connect(type === "sine" ? g : fl);
            o.start(t);
            o.stop(t + dur + 0.02);
          }
        }
        function chord(t, notes, dur, v, cutoff, a, rel, dest = duck) {
          const fl = ac.createBiquadFilter();
          fl.type = "lowpass";
          fl.frequency.value = cutoff;
          fl.Q.value = 0.8;
          const g = ac.createGain();
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(v, t + a);
          g.gain.setValueAtTime(v, t + Math.max(a, dur - rel));
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          fl.connect(g).connect(dest);
          notes.forEach((n, i) => {
            for (const det of [-9, 9]) {
              const o = ac.createOscillator();
              o.type = "sawtooth";
              o.frequency.value = mtof(n);
              o.detune.value = det;
              const p = ac.createStereoPanner();
              p.pan.value = (det > 0 ? 0.35 : -0.35) * (i % 2 ? -1 : 1);
              o.connect(p).connect(fl);
              o.start(t);
              o.stop(t + dur + 0.05);
            }
          });
        }
        const up = (notes, k = 12) => notes.map((x) => x + k);
        const stab = (t, notes, v = 0.11, dur = 0.2) =>
          chord(t, notes, dur, v, 2600, 0.004, dur - 0.01);
        const pad = (t, notes, dur, v = 0.07) =>
          chord(t, notes, dur, v, 1100, 0.25, 0.5, duck);
        function pluck(t, n, v = 0.12, pan = 0) {
          tone(t, mtof(n), 0.32, v, "triangle", fx, 0.002, pan);
          tone(t, mtof(n + 12), 0.14, v * 0.4, "sine", fx, 0.002, pan);
        }
        function bell(t, n, v = 0.3) {
          const f = mtof(n);
          const car = ac.createOscillator();
          car.frequency.value = f;
          const mod = ac.createOscillator();
          mod.frequency.value = f * 3.5;
          const idx = ac.createGain();
          idx.gain.setValueAtTime(f * 2.2, t);
          idx.gain.exponentialRampToValueAtTime(1, t + 1.6);
          mod.connect(idx).connect(car.frequency);
          const g = ac.createGain();
          env(g, t, 0.002, v, 3.2);
          car.connect(g).connect(fx);
          car.start(t);
          mod.start(t);
          car.stop(t + 3.3);
          mod.stop(t + 3.3);
        }
        const click = (t, v = 0.08) =>
          hit(t, 0.012, "bandpass", 3600, v, fx, 2, (r() - 0.5) * 0.6);
        const tick = (t, hi, v = 0.1) => tone(t, hi ? 2100 : 1550, 0.03, v, "sine", fx);
        /** Four on the floor from `from` to `to`, the chords counted in bars from `origin`. */
        const groove = (from, to, origin, o = {}) => {
          for (let n = from; n < to; n++) {
            const ch = Math.floor((n - origin) / 4) % 4;
            kick(T(n));
            if (n % 2 === 1) clap(T(n), 0.42);
            hat(T(n + 0.5), 0.13, o.open ?? false, -0.2);
            for (const s of [0.25, 0.75]) hat(T(n + s), 0.05, false, 0.3);
            for (const s of [0, 0.5])
              bass(T(n + s), ROOTS[ch] + (s ? 12 : 0), D(0.45), 0.3);
            if (o.stabs) stab(T(n + 0.5), up(CHORDS[ch]), 0.075);
          }
        };

        // 1 · hook (0–4)
        impact(0);
        kick(0);
        stab(0, up(CHORDS[0]), 0.14, 0.35);
        for (let s = 0; s < 8; s++) hat(T(s * 0.25), 0.04 + s * 0.012);
        impact(T(2), 0.8);
        kick(T(2));
        kick(T(3));
        clap(T(2), 0.5);
        stab(T(2), up(CHORDS[0]), 0.14, 0.35);
        for (let s = 8; s < 16; s++) hat(T(s * 0.25), 0.07);
        for (const s of [2, 2.5, 3, 3.5])
          bass(T(s), ROOTS[0] + (s % 1 ? 12 : 0), D(0.45));
        whoosh(T(3.4), D(0.6), true, 0.3);

        // 2 · files (4–12)
        groove(4, 12, 0);
        pad(T(4), CHORDS[1], D(4));
        pad(T(8), CHORDS[2], D(4));
        TYPED.forEach((w, i) => {
          for (let c = 0; c < w.length; c++)
            click(T(4 + i * 0.5) + (c * 0.15) / w.length, 0.07);
        });
        whoosh(T(8), D(2.4), false, 0.22);
        stab(T(10.5), up(CHORDS[2]), 0.16, 0.3);
        stab(T(11), up(CHORDS[3]), 0.16, 0.3);
        impact(T(10.5), 0.35);
        for (let i = 0; i < 3; i++) whoosh(T(11.5 + i * 0.125), D(0.3), true, 0.16);

        // 3 · hours (12–20): half time, the clock ticking faster
        for (const n of [12, 14, 16]) kick(T(n));
        for (const n of [13, 15, 17]) snare(T(n), 0.22);
        bass(T(12), ROOTS[3], D(3.9), 0.24);
        bass(T(16), ROOTS[1], D(3.9), 0.24);
        pad(T(12), CHORDS[3], D(4), 0.06);
        pad(T(16), CHORDS[1], D(4), 0.06);
        for (let s = 12, i = 0; s < 20; s += s < 16 ? 0.5 : s < 18 ? 0.25 : 0.125, i++)
          tick(T(s), i % 2 === 0, 0.08);
        impact(T(18), 0.7);
        clap(T(18), 0.55);
        riser(T(18.5), T(20), 0.16);

        // 4 · the grind (20–28): a hit and a new chord on every beat
        const grind = [0, 1, 2, 3, 0, 1, 3];
        for (let n = 20; n < 27; n++) {
          const ch = grind[n - 20];
          kick(T(n));
          clap(T(n), 0.36);
          stab(T(n), up(CHORDS[ch]), 0.12, 0.26);
          bass(T(n), ROOTS[ch], D(0.45));
          bass(T(n + 0.5), ROOTS[ch] + 12, D(0.45));
          for (const s of [0.25, 0.5, 0.75]) hat(T(n + s), 0.06);
        }
        for (let n = 20; n < 28; n++) click(T(n), 0.12);
        tone(T(26), 92, D(0.9), 0.2, "square", lp);
        tone(T(26), 97.5, D(0.9), 0.2, "square", lp);
        kick(T(27));
        [0, 2, 3, 5].forEach((st, i) => {
          clap(T(27 + i * 0.25), 0.4);
          stab(T(27 + i * 0.25), up(CHORDS[0], 12 + st), 0.12, 0.12);
        });

        // 5 · the turn (28–36): the beat drops out
        pad(T(28), CHORDS[2], D(4), 0.11);
        pad(T(32), CHORDS[3], D(3.5), 0.11);
        for (let s = 0; s < 15; s++) {
          const ch = s < 8 ? CHORDS[2] : CHORDS[3];
          pluck(
            T(28 + s * 0.5),
            ch[s % 3] + 12 + (s % 4 === 3 ? 12 : 0),
            0.14,
            s % 2 ? 0.4 : -0.4,
          );
        }
        DROP_FILES.forEach((_, i) =>
          tone(T(30 + i * 0.5) + 0.3, 140, 0.14, 0.4, "sine", fx),
        );
        riser(T(32), T(35.5), 0.34);
        for (let s = 32; s < 35.5; s += s < 34 ? 0.5 : s < 35 ? 0.25 : 0.125)
          snare(T(s), 0.08 + ((s - 32) / 3.5) * 0.3);
        whoosh(T(35.1), D(0.4), true, 0.3);

        // 6 · the drop (36–52)
        impact(T(36), 1.1);
        hit(T(36), 1.8, "highpass", 5000, 0.2, fx);
        groove(36, 52, 36, { stabs: true, open: true });
        for (let bar = 0; bar < 4; bar++) pad(T(36 + bar * 4), CHORDS[bar], D(4), 0.05);
        for (let i = 0; i < 24; i++) click(T(37.5) + (i * D(1)) / 24, 0.05);
        whoosh(T(39.6), D(0.6), true, 0.18);
        [0, 1, 2, 3].forEach((i) => tick(T(40.75 + i * 0.25), true, 0.08));
        whoosh(T(43.7), D(0.5), true, 0.3);
        hit(T(44), 1.2, "highpass", 5000, 0.14, fx);
        bell(T(47.25), 88, 0.12);
        hit(T(48), 1.2, "highpass", 5000, 0.14, fx);
        whoosh(T(48.4), D(0.8), false, 0.2);
        click(T(50.75), 0.25);
        tone(T(50.9), mtof(81), 0.2, 0.1, "triangle");
        tone(T(51), mtof(88), 0.3, 0.1, "triangle");

        // 7 · the half day (52–60): the music sinks under a closing filter
        groove(52, 60, 48, { stabs: true });
        lp.frequency.setValueAtTime(19000, T(54));
        lp.frequency.exponentialRampToValueAtTime(520, T(59.5));
        lp.frequency.setValueAtTime(19000, T(60));
        for (const n of [54, 54.5, 55]) stab(T(n), up(CHORDS[1]), 0.12, 0.2);
        whoosh(T(58), D(0.6), false, 0.3);
        [76, 72, 69, 64, 60].forEach((n, i) => pluck(T(59) + i * 0.07, n, 0.09));

        // 8 · the becoming (60–68)
        pad(T(60), CHORDS[1], D(4), 0.08);
        pad(T(64), CHORDS[3], D(4), 0.08);
        bass(T(60), ROOTS[1], D(3.9), 0.2);
        bass(T(64), ROOTS[3], D(3.9), 0.2);
        for (let s = 0; s < 4; s++)
          pluck(T(60 + s * 0.5), CHORDS[1][s % 3] + 12, 0.1, s % 2 ? 0.4 : -0.4);
        const penta = [81, 84, 86, 88, 91, 93];
        for (let i = 0; i < 30; i++)
          tone(
            T(62) + r() * D(3.6),
            mtof(penta[Math.floor(r() * penta.length)]),
            0.18,
            0.045,
            "sine",
            fx,
            0.002,
            (r() - 0.5) * 1.4,
          );
        riser(T(63), T(67.875), 0.3);
        for (let s = 66; s < 67.875; s += s < 67 ? 0.25 : 0.125)
          snare(T(s), 0.1 + ((s - 66) / 1.9) * 0.25);

        // 9 · the mark (68–76): home, and still
        impact(T(68), 1);
        kick(T(68));
        hit(T(68), 2.4, "highpass", 5000, 0.18, fx);
        chord(T(68), [57, 60, 64, 71], TOTAL - T(68), 0.085, 1600, 0.01, 3.5, lp);
        chord(T(68), [69, 72, 76], TOTAL - T(68), 0.035, 3000, 0.01, 3.5, lp);
        bass(T(68), 45, TOTAL - T(68) - 0.05, 0.28);
        bell(T(68.5), 81, 0.3);
        whoosh(T(69.7), D(0.9), true, 0.12);
        [76, 81, 84].forEach((n, i) => pluck(T(71 + i * 0.25), n, 0.08));

        // sidechain: the bass and pads breathe around every kick
        kicks.sort((x, y) => x - y);
        duck.gain.setValueAtTime(1, 0);
        for (const k of kicks) {
          duck.gain.setValueAtTime(0.32, k);
          duck.gain.setTargetAtTime(1, k + 0.02, 0.07);
        }
      }

      async function renderScore(sampleRate = 48000) {
        const ac = new OfflineAudioContext(2, Math.round(sampleRate * TOTAL), sampleRate);
        score(ac);
        return ac.startRendering();
      }

      /** The rendered score as a 16-bit WAV, base64, for the recorder. */
      async function scoreWav() {
        const buf = await renderScore();
        const n = buf.length;
        const data = new DataView(new ArrayBuffer(44 + n * 4));
        const str = (o, s) =>
          [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
        str(0, "RIFF");
        data.setUint32(4, 36 + n * 4, true);
        str(8, "WAVEfmt ");
        data.setUint32(16, 16, true);
        data.setUint16(20, 1, true);
        data.setUint16(22, 2, true);
        data.setUint32(24, buf.sampleRate, true);
        data.setUint32(28, buf.sampleRate * 4, true);
        data.setUint16(32, 4, true);
        data.setUint16(34, 16, true);
        str(36, "data");
        data.setUint32(40, n * 4, true);
        const l = buf.getChannelData(0);
        const rch = buf.getChannelData(1);
        let peak = 0;
        for (let i = 0; i < n; i++) {
          for (const [k, ch] of [
            [0, l],
            [1, rch],
          ]) {
            const v = clamp(ch[i], -1, 1);
            peak = Math.max(peak, Math.abs(ch[i]));
            data.setInt16(44 + i * 4 + k * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
          }
        }
        const bytes = new Uint8Array(data.buffer);
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000)
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return { wav: btoa(bin), peak };
      }

      /* ---------------------------------------------------------------- playback */

      const ready = Promise.all(
        [
          "300 100px 'Space Grotesk'",
          "500 100px 'Space Grotesk'",
          "600 100px 'Space Grotesk'",
          "700 100px 'Space Grotesk'",
          "500 100px Inter",
          "600 100px Inter",
          "700 100px Inter",
        ].map((f) => document.fonts.load(f)),
      ).then(() => document.fonts.ready);

      window.__duration = TOTAL;
      window.__size = { width: W, height: H };
      window.__seek = render;
      window.__ready = ready;
      window.__score = scoreWav;

      if (params.has("still")) document.documentElement.classList.add("still");
      ready.then(() => {
        const at0 = params.get("t");
        render(at0 === null ? TOTAL : Number(at0));
        if (params.has("still") || at0 !== null) return;
        let audio;
        document.getElementById("play").addEventListener("click", async () => {
          const ac = new AudioContext();
          audio ??= await renderScore(ac.sampleRate);
          const src = ac.createBufferSource();
          src.buffer = audio;
          src.connect(ac.destination);
          const start = ac.currentTime + 0.15;
          src.start(start);
          const loop = () => {
            const t = ac.currentTime - start;
            render(Math.max(0, t));
            if (t < TOTAL) requestAnimationFrame(loop);
            else ac.close();
          };
          requestAnimationFrame(loop);
        });
      });
    </script>
  </body>
</html>
