        kick(T(2));
        kick(T(3));
        clap(T(2), 0.5);
        stab(
          T(2),
          CHORDS[0].map((x) => x + 12),
          0.14,
          0.35,
        );
        for (let s = 8; s < 16; s++) hat(T(s * 0.25), 0.07);
        for (const s of [2, 2.5, 3, 3.5])
          bass(T(s), ROOTS[0] + (s % 1 ? 12 : 0), T(0.45));
        whoosh(T(3.4), T(0.6), true, 0.3);

        // 2 · files
        groove(4, 12, { stabs: false });
        pad(T(4), CHORDS[1], T(4));
        pad(T(8), CHORDS[2], T(4));
        TYPED.forEach((w, i) => {
          for (let c = 0; c < w.length; c++)
            click(T(4 + i * 0.5) + (c * 0.15) / w.length, 0.07);
        });
        whoosh(T(8), T(2.4), false, 0.22);
        stab(
          T(10.5),
          CHORDS[2].map((x) => x + 12),
          0.16,
          0.3,
        );
        stab(
          T(11),
          CHORDS[3].map((x) => x + 12),
          0.16,
          0.3,
        );
        impact(T(10.5), 0.35);
        for (let i = 0; i < 3; i++) whoosh(T(11.5 + i * 0.125), T(0.3), true, 0.16);

        // 3 · hours
        kick(T(12));
        kick(T(14));
        snare(T(13), 0.22);
        bass(T(12), ROOTS[3], T(3.9), 0.26);
        pad(T(12), CHORDS[3], T(4), 0.06);
        for (let s = 12, i = 0; s < 16; s += s < 14 ? 0.5 : s < 15 ? 0.25 : 0.125, i++)
          tick(T(s), i % 2 === 0, 0.09);
        impact(T(15), 0.7);
        clap(T(15), 0.55);

        // 4 · the grind: a hit and a new chord on every beat
        const grind = [
          CHORDS[0],
          CHORDS[1],
          CHORDS[2],
          CHORDS[3],
          CHORDS[0],
          CHORDS[1],
          CHORDS[3],
        ];
        for (let n = 16; n < 23; n++) {
          kick(T(n));
          clap(T(n), 0.36);
          stab(
            T(n),
            grind[n - 16].map((x) => x + 12),
            0.12,
            0.26,
          );
          bass(T(n), ROOTS[chordOf(n)], T(0.45));
          bass(T(n + 0.5), ROOTS[chordOf(n)] + 12, T(0.45));
          for (const s of [0.25, 0.5, 0.75]) hat(T(n + s), 0.06);
        }
        for (let n = 16; n < 24; n++) click(T(n), 0.12);
        tone(T(22), 92, T(0.9), 0.2, "square", lp);
        tone(T(22), 97.5, T(0.9), 0.2, "square", lp);
        kick(T(23));
        [0, 2, 3, 5].forEach((st, i) => {
          clap(T(23 + i * 0.25), 0.4);
          stab(
            T(23 + i * 0.25),
            CHORDS[0].map((x) => x + 12 + st),
            0.12,
            0.12,
          );
        });

        // 5 · the turn: the beat drops out
        pad(T(24), CHORDS[2], T(4), 0.11);
        pad(T(28), CHORDS[3], T(3.5), 0.11);
        for (let s = 0; s < 15; s++) {
          const n = 24 + s * 0.5;
          const ch = CHORDS[chordOf(n)];
          pluck(T(n), ch[s % 3] + 12 + (s % 4 === 3 ? 12 : 0), 0.14, s % 2 ? 0.4 : -0.4);
        }
        DROP_FILES.forEach((_, i) =>
          tone(T(26 + i * 0.5) + 0.3, 140, 0.14, 0.4, "sine", fx),
        );
        riser(T(28), T(31.5), 0.34);
        for (let s = 28; s < 31.5; s += s < 30 ? 0.5 : s < 31 ? 0.25 : 0.125)
          snare(T(s), 0.08 + ((s - 28) / 3.5) * 0.3);
        whoosh(T(31.1), T(0.4), true, 0.3);

        // 6 · the drop
        impact(T(32), 1.1);
        hit(T(32), 1.8, "highpass", 5000, 0.2, fx);
        groove(32, 48, { stabs: true, open: true });
        for (let bar = 0; bar < 4; bar++) pad(T(32 + bar * 4), CHORDS[bar], T(4), 0.05);
        for (let i = 0; i < 24; i++) click(T(33.5) + (i * T(1)) / 24, 0.05);
        whoosh(T(35.6), T(0.6), true, 0.18);
        [0, 1, 2, 3].forEach((i) => tick(T(36.75 + i * 0.25), true, 0.08));
        whoosh(T(39.7), T(0.5), true, 0.3);
        hit(T(40), 1.2, "highpass", 5000, 0.14, fx);
        bell(T(43.25), 88, 0.12);
        hit(T(44), 1.2, "highpass", 5000, 0.14, fx);
        whoosh(T(44.4), T(0.8), false, 0.2);
        click(T(46.75), 0.25);
        tone(T(46.9), mtof(81), 0.2, 0.1, "triangle");
        tone(T(47.0), mtof(88), 0.3, 0.1, "triangle");

        // 7 · the half day: the music sinks under a closing filter
        groove(48, 52, { stabs: true });
        lp.frequency.setValueAtTime(19000, T(48));
        lp.frequency.exponentialRampToValueAtTime(520, T(51.5));
        lp.frequency.setValueAtTime(19000, T(52));
        whoosh(T(51), T(0.45), false, 0.3);
        [76, 72, 69, 64, 60].forEach((n, i) => pluck(T(51.5) + i * 0.07, n, 0.09));

        // 8 · the becoming
        pad(T(52), CHORDS[1], T(2), 0.08);
        pad(T(54), CHORDS[3], T(2), 0.08);
        bass(T(52), ROOTS[1], T(1.9), 0.2);
        bass(T(54), ROOTS[3], T(1.9), 0.2);
        const penta = [81, 84, 86, 88, 91, 93];
        for (let i = 0; i < 26; i++)
          tone(
            T(53) + r() * T(2.5),
            mtof(penta[Math.floor(r() * penta.length)]),
            0.18,
            0.045,
            "sine",
            fx,
            0.002,
            (r() - 0.5) * 1.4,
          );
        riser(T(53), T(55.875), 0.3);
        for (let s = 54; s < 55.875; s += s < 55 ? 0.25 : 0.125)
          snare(T(s), 0.1 + ((s - 54) / 1.9) * 0.25);

        // 9 · the mark: home, and still
        impact(T(56), 1);
        kick(T(56));
        hit(T(56), 2.4, "highpass", 5000, 0.18, fx);
        chord(T(56), [57, 60, 64, 71], TOTAL - T(56), 0.085, 1600, 0.01, 3.5, lp);
        chord(T(56), [69, 72, 76], TOTAL - T(56), 0.035, 3000, 0.01, 3.5, lp);
        bass(T(56), 45, TOTAL - T(56) - 0.05, 0.28);
        bell(T(56.5), 81, 0.3);
        whoosh(T(57.7), T(0.9), true, 0.12);
        [76, 81, 84].forEach((n, i) => pluck(T(59 + i * 0.25), n, 0.08));

        // sidechain: the bass and pads breathe around every kick
        kicks.sort((x, y) => x - y);
        duck.gain.setValueAtTime(1, 0);
        for (const k of kicks) {
          duck.gain.setValueAtTime(0.32, k);
          duck.gain.setTargetAtTime(1, k + 0.02, 0.07);
        }
      }

      async function renderScore(sampleRate = 48000) {
        const ac = new OfflineAudioContext(2, Math.round(sampleRate * TOTAL), sampleRate);
        score(ac);
        return ac.startRendering();
      }

      /** The rendered score as a 16-bit WAV, base64, for the recorder. */
      async function scoreWav() {
        const buf = await renderScore();
        const n = buf.length;
        const data = new DataView(new ArrayBuffer(44 + n * 4));
        const str = (o, s) =>
          [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
        str(0, "RIFF");
        data.setUint32(4, 36 + n * 4, true);
        str(8, "WAVEfmt ");
        data.setUint32(16, 16, true);
        data.setUint16(20, 1, true);
        data.setUint16(22, 2, true);
        data.setUint32(24, buf.sampleRate, true);
        data.setUint32(28, buf.sampleRate * 4, true);
        data.setUint16(32, 4, true);
        data.setUint16(34, 16, true);
        str(36, "data");
        data.setUint32(40, n * 4, true);
        const l = buf.getChannelData(0);
        const rch = buf.getChannelData(1);
        let peak = 0;
        for (let i = 0; i < n; i++) {
          for (const [k, ch] of [
            [0, l],
            [1, rch],
          ]) {
            const v = clamp(ch[i], -1, 1);
            peak = Math.max(peak, Math.abs(ch[i]));
            data.setInt16(44 + i * 4 + k * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
          }
        }
        const bytes = new Uint8Array(data.buffer);
        let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000)
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return { wav: btoa(bin), peak };
      }

      /* ---------------------------------------------------------------- playback */

      const ready = Promise.all(
        [
          "300 100px 'Space Grotesk'",
          "500 100px 'Space Grotesk'",
          "600 100px 'Space Grotesk'",
          "700 100px 'Space Grotesk'",
          "500 100px Inter",
          "600 100px Inter",
          "700 100px Inter",
        ].map((f) => document.fonts.load(f)),
      ).then(() => document.fonts.ready);

      window.__duration = TOTAL;
      window.__seek = render;
      window.__ready = ready;
      window.__score = scoreWav;

      const params = new URLSearchParams(location.search);
      if (params.has("still")) document.documentElement.classList.add("still");
      ready.then(() => {
        const at0 = params.get("t");
        render(at0 === null ? b(62) : Number(at0));
        if (params.has("still") || at0 !== null) return;
        let audio;
        document.getElementById("play").addEventListener("click", async () => {
          const ac = new AudioContext();
          audio ??= await renderScore(ac.sampleRate);
          const src = ac.createBufferSource();
          src.buffer = audio;
          src.connect(ac.destination);
          const start = ac.currentTime + 0.15;
          src.start(start);
          const loop = () => {
            const t = ac.currentTime - start;
            render(Math.max(0, t));
            if (t < TOTAL) requestAnimationFrame(loop);
            else ac.close();
          };
          requestAnimationFrame(loop);
        });
      });
    </script>
  </body>
</html>
