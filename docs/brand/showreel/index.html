<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Magic MIS — showreel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;600;700&family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * The showreel. 38 seconds, 120 BPM, nineteen bars: every cut is on a beat. Two
       * formats from one source — landscape 1920×1080 by default, portrait 1080×1920 with
       * `?format=portrait` — laid out for each, never cropped from the other.
       *
       * Like the tour (docs/brand/explainer), nothing here is a CSS animation. The picture is
       * one canvas drawn by `render(t)`, a pure function of the clock, and the soundtrack is
       * one Web Audio graph built by `score(ctx)` against the same beat grid — so the recorder
       * (apps/web/e2e/support/record-showreel.ts) can seek it frame by frame and render the
       * music offline, and the two cannot drift.
       *
       * Brand rules hold (ADR 0036): no gradients and no glows — every colour shift is a flat
       * field — headlines in Space Grotesk, figures in Inter at fixed digit widths, one indigo
       * accent, and dense figures never sit on the ink surface. Every company and figure is
       * invented, and the dashboard says so.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141029;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      .portrait canvas {
        width: min(100vw, calc(100vh * 9 / 16));
        aspect-ratio: 9 / 16;
      }
      #play {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: #5846d2;
        color: #fff;
        font:
          600 16px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      #play:focus-visible {
        outline: 3px solid #ab9ef5;
        outline-offset: 3px;
      }
      .still #play {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <button id="play" type="button">Play with sound</button>
    <script>
      "use strict";

      /* ---------------------------------------------------------------- the frame and the grid */

      const params = new URLSearchParams(location.search);
      const PORTRAIT = params.get("format") === "portrait";
      const W = PORTRAIT ? 1080 : 1920;
      const H = PORTRAIT ? 1920 : 1080;
      const CX = W / 2;
      const CY = H / 2;
      /** The margin type hangs from. */
      const M = PORTRAIT ? 80 : 150;

      const BPM = 120;
      const BEAT = 60 / BPM; // 0.5 s
      const BARS = 19;
      const TOTAL = BARS * 4 * BEAT; // 38 s
      const b = (n) => n * BEAT;

      const C = {
        ink: "#141029",
        ink2: "#1b1739",
        ink3: "#252048",
        ink5: "#413c73",
        indigo: "#5846d2",
        indigo5: "#6c5ce7",
        a200: "#cbc3fa",
        lav: "#ab9ef5",
        lavText: "#a99cf3",
        lav100: "#e4e0fd",
        lav50: "#f1effe",
        white: "#ffffff",
        paper: "#f5f5f9",
        n100: "#ecebf2",
        n200: "#dedce8",
        n400: "#928fa6",
        n500: "#6f6c85",
        n700: "#403e50",
        n900: "#191824",
        muted: "#b8b4d2",
        pos: "#15724a",
        posBg: "#e4f5ec",
        neg: "#b03024",
        negBg: "#fceceb",
      };
      const DISPLAY = "'Space Grotesk', Inter, sans-serif";
      const BODY = "Inter, system-ui, sans-serif";

      const canvas = document.getElementById("c");
      canvas.width = W;
      canvas.height = H;
      if (PORTRAIT) document.documentElement.classList.add("portrait");
      const ctx = canvas.getContext("2d");

      /* ---------------------------------------------------------------- maths */

      const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, z, p) => a + (z - a) * p;
      const E = {
        lin: (p) => p,
        out: (p) => 1 - Math.pow(1 - p, 3),
        out5: (p) => 1 - Math.pow(1 - p, 5),
        in3: (p) => p * p * p,
        inout: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        expo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
        inexpo: (p) => (p <= 0 ? 0 : Math.pow(2, 10 * p - 10)),
        back: (p) => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2),
        bounce: (p) => {
          const n = 7.5625;
          const d = 2.75;
          if (p < 1 / d) return n * p * p;
          if (p < 2 / d) return n * (p -= 1.5 / d) * p + 0.75;
          if (p < 2.5 / d) return n * (p -= 2.25 / d) * p + 0.9375;
          return n * (p -= 2.625 / d) * p + 0.984375;
        },
      };
      /** A bump that rises and falls once over `d` seconds from `a`. */
      const bump = (t, a, d) =>
        t < a || t > a + d ? 0 : Math.sin((Math.PI * (t - a)) / d);

      function rng(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) >>> 0;
          let x = Math.imul(s ^ (s >>> 15), 1 | s);
          x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
      }

      function hex(c) {
        const n = parseInt(c.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      /** A flat colour part-way between two others — a colour shift, never a gradient. */
      function mix(a, z, p) {
        const [r1, g1, b1] = hex(a);
        const [r2, g2, b2] = hex(z);
        const q = clamp(p);
        return `rgb(${Math.round(lerp(r1, r2, q))},${Math.round(lerp(g1, g2, q))},${Math.round(lerp(b1, b2, q))})`;
      }

      /** Camera shake that decays after each hit. */
      function shake(t, hits, amp = 14, decay = 9) {
        let x = 0;
        let y = 0;
        for (const h of hits) {
          const d = t - h;
          if (d >= 0 && d < 0.7) {
            const k = amp * Math.exp(-d * decay);
            x += k * Math.sin(d * 83 + h * 7);
            y += k * Math.cos(d * 71 + h * 3);
          }
        }
        return { x, y };
      }

      /* ---------------------------------------------------------------- drawing */

      function reset() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.setLineDash([]);
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
        ctx.letterSpacing = "0px";
      }
      function bg(c) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = c;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
      /** Camera: world point (x, y) at the centre of the frame, `z` times larger, turned by `r`. */
      function cam(x, y, z = 1, r = 0) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.translate(CX, CY);
        ctx.rotate(r);
        ctx.scale(z, z);
        ctx.translate(-x, -y);
      }
      function setFont(size, weight = 600, fam = DISPLAY, track) {
        ctx.font = `${weight} ${size}px ${fam}`;
        const k = track ?? (fam === DISPLAY ? -0.025 : 0);
        ctx.letterSpacing = `${(k * size).toFixed(2)}px`;
      }
      const tw = (s) => ctx.measureText(s).width;
      /** The largest size up to `size` at which `s` fits in `maxW`. */
      function fit(s, size, maxW, weight = 700, track) {
        setFont(size, weight, DISPLAY, track);
        const w = tw(s);
        return w <= maxW ? size : Math.floor((size * maxW) / w);
      }
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }
      function circle(x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
        ctx.fill();
      }

      const charCache = new Map();
      function cw(ch) {
        const k = ctx.font + "|" + ch;
        let w = charCache.get(k);
        if (w === undefined) {
          w = ctx.measureText(ch).width;
          charCache.set(k, w);
        }
        return w;
      }
      const isDigit = (ch) => ch >= "0" && ch <= "9";
      /** Figures right-aligned at `xr`, every digit on the same advance — tabular by hand. */
      function tab(s, xr, y) {
        ctx.textAlign = "left";
        const dw = cw("0");
        let x = xr;
        for (let i = s.length - 1; i >= 0; i--) {
          const ch = s[i];
          const d = isDigit(ch);
          const w = d ? dw : cw(ch);
          x -= w;
          ctx.fillText(ch, d ? x + (dw - cw(ch)) / 2 : x, y);
        }
      }
      function tabWidth(s) {
        const dw = cw("0");
        let w = 0;
        for (const ch of s) w += isDigit(ch) ? dw : cw(ch);
        return w;
      }

      /** One word sliding up into place through a mask on its own baseline. */
      function maskUp(s, x, y, size, p, color) {
        if (p <= 0) return;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - size * 0.2, y - size * 1.08, tw(s) + size * 0.4, size * 1.4);
        ctx.clip();
        ctx.fillStyle = color;
        ctx.fillText(s, x, y + (1 - p) * size * 1.15);
        ctx.restore();
      }
      /** Strings to timed words: the first at `beat`, each next `step` beats later. */
      const at = (list, beat, step) =>
        list.map((w, i) => {
          const o = typeof w === "string" ? { s: w } : w;
          return { ...o, at: b(beat + i * step) };
        });
      /**
       * Words, each arriving through its mask at its own time, wrapped at `maxW` (or before a
       * word marked `nl`). Returns the number of lines.
       */
      function words(list, x, y, size, t, o = {}) {
        const {
          weight = 600,
          fam = DISPLAY,
          color = C.ink,
          align = "left",
          dur = 0.34,
          ease = E.expo,
          alpha = 1,
          maxW = Infinity,
          lead = 1.12,
        } = o;
        setFont(size, weight, fam);
        ctx.textAlign = "left";
        const sp = tw(" ");
        let line = [];
        let lw = 0;
        const lines = [line];
        for (const w of list) {
          const ww = tw(w.s);
          if (line.length > 0 && (w.nl || lw + sp + ww > maxW)) {
            line = [];
            lines.push(line);
            lw = 0;
          }
          lw += (line.length > 0 ? sp : 0) + ww;
          line.push({ ...w, w: ww });
        }
        ctx.globalAlpha = alpha;
        lines.forEach((ln, li) => {
          const total = ln.reduce((a, w) => a + w.w, 0) + sp * (ln.length - 1);
          let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
          for (const w of ln) {
            maskUp(
              w.s,
              cx,
              y + li * size * lead,
              size,
              ease(clamp((t - w.at) / dur)),
              w.color ?? color,
            );
            cx += w.w + sp;
          }
        });
        ctx.globalAlpha = 1;
        return lines.length;
      }
      /** A word that lands hard: scaled down onto its baseline at (x, y), centred on x. */
      function slam(s, x, y, size, t, t0, o = {}) {
        if (t < t0) return;
        const { weight = 700, color = C.ink, from = 1.45, dur = 0.24, track } = o;
        const p = E.expo(clamp((t - t0) / dur));
        ctx.save();
        setFont(size, weight, DISPLAY, track);
        ctx.textAlign = "center";
        ctx.translate(x, y - size * 0.35);
        const k = lerp(from, 1, p);
        ctx.scale(k, k);
        ctx.globalAlpha = clamp((t - t0) / 0.04);
        ctx.fillStyle = color;
        ctx.fillText(s, 0, size * 0.35);
        ctx.restore();
      }

      function dotGrid(color, alpha, step = 32, pad = 0) {
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        for (let y = step / 2 - pad; y < H + pad; y += step)
          for (let x = step / 2 - pad; x < W + pad; x += step)
            ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
        ctx.globalAlpha = 1;
      }

      function pill(text, x, y, size, fg, bgc) {
        setFont(size, 600, BODY);
        const w = tw(text) + size * 1.1;
        const h = size * 1.75;
        ctx.fillStyle = bgc;
        rr(x, y - h / 2, w, h, h / 2);
        ctx.fill();
        ctx.fillStyle = fg;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(text, x + size * 0.55, y + 1);
        ctx.textBaseline = "alphabetic";
        return w;
      }

      /* ---------------------------------------------------------------- the mark */

      // MARK_PATH in apps/web/src/components/Logo.tsx: an M that is also a rising line.
      const MARK = [
        [13, 47],
        [23, 19],
        [32, 33],
        [42, 13],
        [51, 29],
      ];
      function markStroke(x0, y0, k) {
        ctx.beginPath();
        MARK.forEach(([px, py], i) =>
          i === 0
            ? ctx.moveTo(x0 + px * k, y0 + py * k)
            : ctx.lineTo(x0 + px * k, y0 + py * k),
        );
      }
      function mark(cx, cy, size, o = {}) {
        const {
          tile = 1,
          tileColor = C.indigo,
          stroke = C.white,
          ring = 1,
          strokeAlpha = 1,
        } = o;
        const k = size / 64;
        const x0 = cx - size / 2;
        const y0 = cy - size / 2;
        if (tile > 0) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(tile, tile);
          ctx.fillStyle = tileColor;
          rr(-size / 2, -size / 2, size, size, 18 * k);
          ctx.fill();
          ctx.restore();
        }
        markStroke(x0, y0, k);
        ctx.lineWidth = 6 * k;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = stroke;
        ctx.globalAlpha = strokeAlpha;
        ctx.stroke();
        ctx.globalAlpha = 1;
        if (ring > 0) {
          ctx.fillStyle = C.white;
          circle(x0 + 51 * k, y0 + 29 * k, 5.5 * k * ring);
          ctx.fillStyle = tileColor;
          circle(x0 + 51 * k, y0 + 29 * k, 2.4 * k * ring);
        }
      }

      /* ================================================================ 1 · the hook
       * 0 → 4 beats. "You already have the numbers."
       * A wall of figures streaming at full speed from the first frame; an indigo band
       * wipes through it; then "numbers." slams in as a window cut into an indigo plate,
       * and its full stop opens into the next scene. */

      const FIELD_COLS = PORTRAIT ? 7 : 12;
      const FIELD_ROWS = PORTRAIT ? 36 : 24;
      const FIELD_FONT = PORTRAIT ? 26 : 30;
      const ROW_H = 60;
      function figure(r) {
        const k = r();
        const v = Math.floor(r() * r() * 9800000 + 1000);
        if (k < 0.12) return `(${v.toLocaleString("en-US")})`;
        if (k < 0.24) return `${(r() * 99).toFixed(1)}%`;
        if (k < 0.38) return v.toLocaleString("en-IN");
        if (k < 0.48)
          return (v / 100).toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        return v.toLocaleString("en-US");
      }
      const FIELD = (() => {
        const r = rng(20261001);
        return Array.from({ length: FIELD_COLS }, (_, i) => ({
          rows: Array.from({ length: FIELD_ROWS }, () => figure(r)),
          dir: i % 2 ? 1 : -1,
          speed: 0.7 + r() * 0.6,
          off: r() * 1400,
          hot: Math.floor(r() * FIELD_ROWS),
        }));
      })();
      function numberField(t) {
        const dist = 2600 * (1 - Math.exp(-t * 1.7)) + 160 * t;
        const colW = W / FIELD_COLS;
        const loop = FIELD_ROWS * ROW_H;
        FIELD.forEach((c, i) => {
          const xr = colW * (i + 1) - 18;
          const shift = c.off + c.dir * c.speed * dist;
          for (let j = 0; j < FIELD_ROWS; j++) {
            const y = ((((j * ROW_H + shift) % loop) + loop) % loop) - ROW_H + 40;
            if (y > H + ROW_H) continue;
            const hot = j === c.hot;
            setFont(FIELD_FONT, hot ? 700 : 500, BODY);
            ctx.fillStyle = hot ? C.indigo : C.n900;
            ctx.globalAlpha = hot ? 1 : 0.8;
            tab(c.rows[j], xr, y);
          }
        });
        ctx.globalAlpha = 1;
      }

      const plate = document.createElement("canvas");
      plate.width = W;
      plate.height = H;
      const pg = plate.getContext("2d");

      function s1(t) {
        bg(C.paper);
        numberField(t);
        if (t < b(2)) {
          const band = PORTRAIT
            ? { y: CY - 230, h: 420, base: CY - 50 }
            : { y: 440, h: 196, base: 584 };
          ctx.fillStyle = C.indigo;
          ctx.fillRect(0, band.y, W * E.expo(clamp((t + 0.06) / 0.3)), band.h);
          words(
            at(["You", "already", { s: "have", nl: PORTRAIT }, "the"], 0.04, 0.5),
            CX,
            band.base,
            124,
            t,
            { color: C.white, align: "center", weight: 700, lead: 1.15 },
          );
          return;
        }
        // "numbers." is a window cut into an indigo plate: the figures run on inside it. In
        // portrait it breaks in two, so the word can still fill the frame.
        const lines = PORTRAIT ? ["num", "bers."] : ["numbers."];
        const last = lines[lines.length - 1];
        const size = fit(
          last,
          PORTRAIT ? 420 : 380,
          W - (PORTRAIT ? 110 : 220),
          700,
          -0.045,
        );
        const lead = size * 0.86;
        const baseY = PORTRAIT ? CY + 380 : 760;
        const midY = baseY - size * 0.35 - ((lines.length - 1) * lead) / 2;
        const sh = shake(t, [b(2)], 26, 8);
        const k = lerp(1.6, 1, E.expo(clamp((t - b(2)) / 0.26)));
        pg.setTransform(1, 0, 0, 1, 0, 0);
        pg.globalCompositeOperation = "source-over";
        pg.fillStyle = C.indigo;
        pg.fillRect(0, 0, W, H);
        pg.globalCompositeOperation = "destination-out";
        pg.font = `700 ${size}px ${DISPLAY}`;
        pg.letterSpacing = `${(-0.045 * size).toFixed(1)}px`;
        pg.textAlign = "center";
        pg.translate(CX + sh.x, midY + sh.y);
        pg.scale(k, k);
        lines.forEach((l, i) =>
          pg.fillText(l, 0, baseY - (lines.length - 1 - i) * lead - midY),
        );
        ctx.drawImage(plate, 0, 0);

        setFont(84, 600);
        ctx.textAlign = "center";
        ctx.fillStyle = C.white;
        const topY = PORTRAIT
          ? baseY - (lines.length - 1) * lead - size * 0.78 - 80
          : 330;
        ctx.fillText("You already have the", CX + sh.x * 0.4, topY + sh.y * 0.4);

        // The full stop opens into the spreadsheet.
        const q = clamp((t - b(3.5)) / b(0.5));
        if (q > 0) {
          pg.setTransform(1, 0, 0, 1, 0, 0);
          const full = pg.measureText(last).width;
          const word = pg.measureText(last.slice(0, -1)).width;
          const dot = pg.measureText(".").width;
          ctx.fillStyle = C.paper;
          circle(
            CX - full / 2 + word + dot * 0.35,
            baseY - size * 0.07,
            lerp(size * 0.06, Math.max(W, H) * 1.3, E.inexpo(q)),
          );
        }
      }

      /* ================================================================ 2 · the files
       * 4 → 12 beats. "Everything you need to understand your business… is already sitting
       * inside your Excel files."
       * Typed into a spreadsheet one cell per eighth note, the camera riding the selection;
       * then a pull-back from one cell to one sheet to a wall of files. */

      const SH = { cw: 154, ch: 46, hx: 60, hy: 46, cols: 10, rows: 20 };
      const SHEET_W = SH.hx + SH.cw * SH.cols;
      const SHEET_H = SH.hy + SH.ch * SH.rows;
      const BAR_H = 150;
      const GAP = 220;
      const WALL_C = PORTRAIT ? 5 : 7;
      const WALL_R = PORTRAIT ? 11 : 5;
      const FILES = [
        "Sales register.xlsx",
        "Ledger export.xlsx",
        "Debtors ageing.xlsx",
        "Payroll — Q4.xlsx",
        "Bank statement.xlsx",
        "Stock summary.xlsx",
        "P&L FY26 final v3.xlsx",
        "Purchase register.xlsx",
        "MIS — Feb (copy).xlsx",
        "Cash flow.xlsx",
        "Fixed assets.xlsx",
        "Budget vs actual.xlsx",
        "GST summary.xlsx",
        "Creditors.xlsx",
        "Expenses — Mar.xlsx",
        "Trial balance FINAL.xlsx",
        "Sales by region.xlsx",
      ];
      const TYPED = [
        "Everything",
        "you",
        "need",
        "to",
        "understand",
        "your",
        "business…",
      ];
      const TYPED_ROW = 5;
      const LEDGERS = [
        "Sales",
        "Freight",
        "Salaries",
        "Rent",
        "Power",
        "Interest",
        "Insurance",
        "Repairs",
        "Travel",
        "Audit fee",
        "Bank charges",
        "Purchases",
        "Discounts",
        "Commission",
        "Telephone",
        "Printing",
        "Depreciation",
        "Packing",
        "Advertising",
        "Legal",
      ];
      const SHEET_CELLS = (() => {
        const r = rng(4242);
        const cells = [];
        for (let row = 0; row < SH.rows; row++)
          for (let col = 1; col < SH.cols; col++)
            if (row !== TYPED_ROW && r() < 0.62) cells.push({ row, col, v: figure(r) });
        return cells;
      })();
      const TILE_BARS = (() => {
        const r = rng(99);
        return Array.from({ length: 36 }, () => ({
          col: Math.floor(r() * SH.cols),
          row: Math.floor(r() * SH.rows),
          w: 0.35 + r() * 0.55,
        }));
      })();
      const cellX = (col) => SH.hx + col * SH.cw;
      const cellY = (row) => SH.hy + row * SH.ch;

      function tileBody(z, name, detail) {
        ctx.fillStyle = C.white;
        rr(0, -BAR_H, SHEET_W, SHEET_H + BAR_H, 40);
        ctx.fill();
        // the title bar: a file badge and its name
        ctx.fillStyle = C.indigo;
        rr(44, -118, 86, 86, 18);
        ctx.fill();
        ctx.fillStyle = C.white;
        for (let i = 0; i < 3; i++) ctx.fillRect(62, -98 + i * 18, 50, 7);
        setFont(64, 600, BODY);
        ctx.fillStyle = C.n900;
        ctx.textAlign = "left";
        ctx.fillText(name, 160, -52);
        // the grid
        ctx.fillStyle = C.n100;
        ctx.fillRect(0, 0, SHEET_W, SH.hy);
        ctx.fillRect(0, 0, SH.hx, SHEET_H);
        ctx.strokeStyle = C.n200;
        ctx.lineWidth = Math.max(1.1 / z, 1);
        ctx.beginPath();
        for (let c = 0; c <= SH.cols; c++) {
          ctx.moveTo(cellX(c), 0);
          ctx.lineTo(cellX(c), SHEET_H);
        }
        for (let r = 0; r <= SH.rows; r++) {
          ctx.moveTo(0, cellY(r));
          ctx.lineTo(SHEET_W, cellY(r));
        }
        ctx.stroke();
        if (detail < 1) {
          ctx.globalAlpha = 1 - detail;
          ctx.fillStyle = C.n200;
          for (const bar of TILE_BARS) {
            const w = SH.cw * bar.w;
            ctx.fillRect(cellX(bar.col + 1) - w - 12, cellY(bar.row) + 16, w, 14);
          }
          ctx.globalAlpha = 1;
        }
      }

      function sheetDetail(z, alpha, t, cur, sel) {
        if (alpha <= 0) return;
        ctx.globalAlpha = alpha;
        // column letters and row numbers, the current ones lit as a spreadsheet lights them
        setFont(17, 600, BODY);
        ctx.textAlign = "center";
        for (let c = 0; c < SH.cols; c++) {
          const lit = c === sel.col;
          if (lit) {
            ctx.fillStyle = C.lav100;
            ctx.fillRect(cellX(c), 0, SH.cw, SH.hy);
          }
          ctx.fillStyle = lit ? C.indigo : C.n500;
          ctx.fillText(String.fromCharCode(65 + c), cellX(c) + SH.cw / 2, 30);
        }
        for (let r = 0; r < SH.rows; r++) {
          const lit = r === TYPED_ROW;
          if (lit) {
            ctx.fillStyle = C.lav100;
            ctx.fillRect(0, cellY(r), SH.hx, SH.ch);
          }
          ctx.fillStyle = lit ? C.indigo : C.n500;
          ctx.fillText(String(r + 1), SH.hx / 2, cellY(r) + 30);
        }
        // the ledger names down column A, the figures across
        setFont(17, 500, BODY);
        ctx.textAlign = "left";
        ctx.fillStyle = C.n700;
        for (let r = 0; r < SH.rows; r++)
          if (r !== TYPED_ROW) ctx.fillText(LEDGERS[r], cellX(0) + 12, cellY(r) + 30);
        ctx.fillStyle = C.n500;
        for (const cell of SHEET_CELLS)
          tab(cell.v, cellX(cell.col + 1) - 12, cellY(cell.row) + 30);
        // what is being typed
        setFont(26, 600, BODY);
        ctx.fillStyle = C.n900;
        TYPED.forEach((w, i) => {
          const t0 = b(4 + i * 0.5);
          if (t < t0) return;
          const n = Math.ceil(w.length * clamp((t - t0) / 0.15));
          const s = w.slice(0, n);
          const x = cellX(i + 1) + 12;
          const y = cellY(TYPED_ROW) + 32;
          ctx.textAlign = "left";
          ctx.fillText(s, x, y);
          if (i === cur && Math.floor((t - t0) / 0.12) % 2 === 0)
            ctx.fillRect(x + tw(s) + 2, y - 22, 2.5, 28);
        });
        // the selection, with its fill handle
        ctx.strokeStyle = C.indigo;
        ctx.lineWidth = 3.2 / z;
        ctx.strokeRect(sel.x, cellY(TYPED_ROW), SH.cw, SH.ch);
        ctx.fillStyle = C.indigo;
        const hs = 9 / z;
        ctx.fillRect(sel.x + SH.cw - hs / 2, cellY(TYPED_ROW) + SH.ch - hs / 2, hs, hs);
        ctx.globalAlpha = 1;
      }

      function s2(t) {
        const cur = clamp(Math.floor((t - b(4)) / b(0.5)), 0, TYPED.length - 1);
        const t0 = b(4 + cur * 0.5);
        const selX = lerp(
          cellX(Math.max(cur, 1)),
          cellX(cur + 1),
          cur === 0 ? 1 : E.expo(clamp((t - t0) / 0.14)),
        );
        const rowY = cellY(TYPED_ROW) + SH.ch / 2;

        // camera: ride the selection, then pull back through the sheet to the wall of files
        const enter = E.expo(clamp((t - b(4)) / 0.5));
        const zRide = PORTRAIT ? lerp(2.7, 1.9, enter) : lerp(3.4, 2.4, enter);
        let z = zRide + 0.25 * clamp((t - b(4)) / b(4));
        const ride = { x: Math.max(selX + 40, W / (2 * z) + 10), y: rowY + 20 };
        let x = ride.x;
        let y = ride.y;
        let r = lerp(-0.05, -0.012, enter);
        const out = E.inout(clamp((t - b(8)) / b(2.6)));
        if (out > 0) {
          z = Math.exp(lerp(Math.log(z), Math.log(PORTRAIT ? 0.15 : 0.17), out));
          x = lerp(ride.x, SHEET_W / 2, out);
          y = lerp(ride.y, (SHEET_H - BAR_H) / 2, out);
          r = lerp(r, 0.02, out);
        }
        z *= 1 + 0.015 * Math.sin(t * 2.1);

        bg(mix(C.paper, C.ink, clamp((0.95 - z) / 0.55)));
        cam(x, y, z, r);
        const detail = clamp((z - 0.35) / 0.45);
        const ripple = (d) =>
          1 +
          0.07 * bump(t, b(10.5) + d * 0.06, 0.32) +
          0.05 * bump(t, b(11) + d * 0.06, 0.28);
        const ci = (WALL_C - 1) / 2;
        const cj = (WALL_R - 1) / 2;
        let n = 0;
        for (let j = 0; j < WALL_R; j++)
          for (let i = 0; i < WALL_C; i++) {
            const di = i - ci;
            const dj = j - cj;
            const s = ripple(Math.hypot(di, dj));
            ctx.save();
            ctx.translate(
              di * (SHEET_W + GAP) + SHEET_W / 2,
              dj * (SHEET_H + BAR_H + GAP) + SHEET_H / 2,
            );
            ctx.scale(s, s);
            ctx.translate(-SHEET_W / 2, -SHEET_H / 2);
            if (di === 0 && dj === 0) {
              tileBody(z, "Trial balance — Mar.xlsx", detail);
              sheetDetail(z, detail, t, cur, { x: selX, col: cur + 1 });
            } else {
              tileBody(z, FILES[n++ % FILES.length], 0);
            }
            ctx.restore();
          }
        reset();

        // the caption, then "Excel files." over a dimmed wall
        const cap = PORTRAIT
          ? { y: H - 330, h: 120, size: 52, x: 70 }
          : { y: 868, h: 128, size: 62, x: 96 };
        if (t >= b(7.9)) {
          setFont(cap.size, 600);
          const wv = tw("is already sitting inside your");
          ctx.fillStyle = C.indigo;
          ctx.fillRect(
            0,
            cap.y,
            (wv + cap.x * 2) * E.expo(clamp((t - b(7.9)) / 0.3)),
            cap.h,
          );
          words(
            at(["is", "already", "sitting", "inside", "your"], 8, 0.25),
            cap.x,
            cap.y + cap.h * 0.66,
            cap.size,
            t,
            {
              color: C.white,
            },
          );
        }
        const dim = clamp((t - b(10.4)) / 0.2);
        if (dim > 0) {
          ctx.fillStyle = C.ink;
          ctx.globalAlpha = 0.62 * dim;
          ctx.fillRect(0, 0, W, cap.y - 8);
          ctx.globalAlpha = 1;
          const sh = shake(t, [b(10.5), b(11)], 12);
          const o = { color: C.white, track: -0.04 };
          if (PORTRAIT) {
            slam("Excel", CX + sh.x, CY - 160 + sh.y, 270, t, b(10.5), o);
            slam("files.", CX + sh.x, CY + 110 + sh.y, 270, t, b(11), {
              ...o,
              color: C.lav,
            });
          } else {
            setFont(250, 700, DISPLAY, -0.04);
            const wE = tw("Excel ");
            const wF = tw("files.");
            const x0 = CX - (wE + wF) / 2;
            slam("Excel", x0 + tw("Excel") / 2 + sh.x, 560 + sh.y, 250, t, b(10.5), o);
            slam("files.", x0 + wE + wF / 2 + sh.x, 560 + sh.y, 250, t, b(11), {
              ...o,
              color: C.lav,
            });
          }
        }
        // three bars wipe the frame on sixteenths: lavender, indigo, ink
        [C.lav, C.indigo, C.ink].forEach((c, i) => {
          const p = E.inout(clamp((t - b(11.5) - b(0.125) * i) / b(0.36)));
          if (p > 0) {
            ctx.fillStyle = c;
            ctx.fillRect(0, 0, W * p, H);
          }
        });
      }

      /* ================================================================ 3 · the hours
       * 12 → 20 beats. "But somehow… turning those numbers into an MIS still takes hours."
       * Ink. A clock whose hands accelerate while the hours fill its ring; "hours." lands on
       * beat 18 and holds for two. */

      function s3(t) {
        bg(C.ink);
        const u = clamp((t - b(12)) / b(8));
        const turns = 9 * E.in3(u) + 0.6 * u;
        const beatPulse = 1 + 0.03 * Math.exp(-((t / BEAT) % 1) * BEAT * 10);
        const clock = PORTRAIT ? { x: CX, y: 520, R: 320 } : { x: 1490, y: 540, R: 300 };
        const R = clock.R;
        ctx.save();
        ctx.translate(clock.x, clock.y);
        ctx.scale(beatPulse, beatPulse);
        ctx.rotate(lerp(0.08, -0.04, E.out(u)));
        for (let i = 0; i < 60; i++) {
          const a = (i / 60) * Math.PI * 2;
          const major = i % 5 === 0;
          ctx.strokeStyle = major ? C.white : C.ink5;
          ctx.globalAlpha = major ? 0.75 : 1;
          ctx.lineWidth = major ? 7 : 3;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(
            Math.sin(a) * (R - (major ? 40 : 18)),
            -Math.cos(a) * (R - (major ? 40 : 18)),
          );
          ctx.lineTo(Math.sin(a) * R, -Math.cos(a) * R);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // the hours, filling the ring
        const hours = (turns / 12) * Math.PI * 2;
        ctx.strokeStyle = C.indigo5;
        ctx.lineWidth = 30;
        ctx.lineCap = "butt";
        ctx.beginPath();
        ctx.arc(
          0,
          0,
          R + 44,
          -Math.PI / 2,
          -Math.PI / 2 + Math.min(hours, Math.PI * 2 - 0.001),
        );
        ctx.stroke();
        const hand = (ang, len, wdt, col) => {
          ctx.strokeStyle = col;
          ctx.lineWidth = wdt;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-Math.sin(ang) * 26, Math.cos(ang) * 26);
          ctx.lineTo(Math.sin(ang) * len, -Math.cos(ang) * len);
          ctx.stroke();
        };
        hand(hours, R - 150, 16, C.lav);
        hand(turns * Math.PI * 2, R - 60, 9, C.white);
        ctx.fillStyle = C.white;
        circle(0, 0, 17);
        ctx.fillStyle = C.ink;
        circle(0, 0, 6);
        ctx.restore();

        const x = PORTRAIT ? M : 140;
        const y = PORTRAIT ? [1040, 1170, 1270, 1400, 1700] : [290, 420, 528, 650, 920];
        const big = PORTRAIT ? 80 : 88;
        words(at(["But", "somehow…"], 12, 0.5), x, y[0], 60, t, {
          color: C.muted,
          weight: 500,
        });
        words(at(["turning", "those", "numbers"], 13.5, 0.5), x, y[1], big, t, {
          color: C.white,
        });
        words(at(["into", "an", { s: "MIS", color: C.lav }], 15, 0.5), x, y[2], big, t, {
          color: C.white,
        });
        words(at(["still", "takes"], 17, 0.5), x, y[3], 60, t, {
          color: C.muted,
          weight: 500,
        });
        if (t >= b(18)) {
          const sh = shake(t, [b(18)], 18);
          setFont(280, 700, DISPLAY, -0.045);
          const w = tw("hours.");
          slam("hours.", x + w / 2 + sh.x, y[4] + sh.y, 280, t, b(18), {
            color: C.lav,
            track: -0.045,
          });
        }
      }

      /* ================================================================ 4 · the grind
       * 20 → 28 beats. "Cleaning. Formatting. Copying. Pasting. Building formulas. Making
       * charts. Fixing them again." One word on every beat, every beat a new colour field and a
       * new typographic trick, punched in by the camera. */

      const JUNK = [
        "N/A",
        "  12400 ",
        "—",
        "#VALUE!",
        "12,400.00",
        "Rs.",
        "n.a.",
        "  ",
        "1.24E+05",
        "TBC",
        "--",
        "?",
        "0",
      ];
      const JUNK_CELLS = (() => {
        const r = rng(7);
        const cols = PORTRAIT ? 4 : 7;
        const rows = PORTRAIT ? 20 : 11;
        const cells = [];
        for (let row = 0; row < rows; row++)
          for (let col = 0; col < cols; col++)
            cells.push({
              x: (PORTRAIT ? 70 : 150) + col * (PORTRAIT ? 250 : 260) + (r() - 0.5) * 70,
              y: (PORTRAIT ? 110 : 120) + row * 92 + (r() - 0.5) * 24,
              junk: JUNK[Math.floor(r() * JUNK.length)],
              clean: Math.floor(r() * 900000 + 1000).toLocaleString("en-US"),
              rot: (r() - 0.5) * 0.12,
            });
        return cells;
      })();
      const ERRORS = [
        "#REF!",
        "#DIV/0!",
        "#N/A",
        "#VALUE!",
        "#NAME?",
        "#REF!",
        "#NUM!",
        "#SPILL!",
      ];
      const ERROR_AT = (() => {
        const r = rng(31);
        return ERRORS.map(() => ({
          x: 160 + r() * (W - 320),
          y: 140 + r() * (H - 280),
          rot: (r() - 0.5) * 0.3,
        }));
      })();
      const FORMULA =
        '=IFERROR(SUMIFS(Ledger!$D:$D,Ledger!$B:$B,$A7,Ledger!$C:$C,">="&EOMONTH(C$2,-1)+1),0)';

      /** A headline centred on `y`; in portrait a "\n" breaks it, and it shrinks to fit. */
      function headline(s, y, size, color, weight = 700) {
        const lines = PORTRAIT ? s.split("\n") : [s.replace("\n", " ")];
        const sz = Math.min(
          ...lines.map((l) => fit(l, size, W - (PORTRAIT ? 90 : 160), weight, -0.04)),
        );
        setFont(sz, weight, DISPLAY, -0.04);
        ctx.textAlign = "center";
        ctx.fillStyle = color;
        lines.forEach((l, i) =>
          ctx.fillText(l, CX, y + (i - (lines.length - 1) / 2) * sz * 0.95),
        );
        return sz;
      }

      function s4(t) {
        const k = clamp(Math.floor((t - b(20)) / BEAT), 0, 7);
        const u = t - b(20 + k);
        const punch = () => cam(CX, CY, 1 + 0.14 * (1 - E.expo(clamp(u / 0.32))));
        const Y = (landscape, portrait) => (PORTRAIT ? portrait : landscape);

        if (k === 0) {
          bg(C.paper);
          punch();
          const wipe = lerp(-80, W + 80, E.inout(clamp(u / 0.42)));
          setFont(34, 500, BODY);
          for (const c of JUNK_CELLS) {
            ctx.fillStyle = C.n400;
            if (c.x < wipe) tab(c.clean, c.x + 200, c.y);
            else {
              ctx.save();
              ctx.translate(c.x, c.y);
              ctx.rotate(c.rot);
              ctx.fillText(c.junk, 0, 0);
              ctx.restore();
            }
          }
          ctx.fillStyle = C.indigo;
          ctx.fillRect(wipe - 14, 0, 28, H);
          headline("Cleaning.", Y(640, CY + 80), 240, C.ink);
        } else if (k === 1) {
          bg(C.indigo);
          punch();
          const icons = ["B", "I", "U", "$", "%", ",", ".00", "⇥"];
          const lit = Math.floor(u / (BEAT / 8));
          const ty = Y(150, CY - 420);
          icons.forEach((ic, i) => {
            const x = CX - (icons.length * 96) / 2 + i * 96 + 6;
            ctx.strokeStyle = C.white;
            ctx.globalAlpha = i <= lit ? 1 : 0.35;
            ctx.lineWidth = 3;
            rr(x, ty, 84, 84, 14);
            if (i === lit % icons.length) {
              ctx.fillStyle = C.white;
              ctx.fill();
            }
            ctx.stroke();
            setFont(ic.length > 1 ? 30 : 40, 700, BODY);
            ctx.fillStyle = i === lit % icons.length ? C.indigo : C.white;
            ctx.textAlign = "center";
            ctx.fillText(ic, x + 42, ty + 56);
          });
          ctx.globalAlpha = 1;
          const st = Math.floor(u / (BEAT / 4)) % 4;
          const weight = [300, 700, 700, 500][st];
          const sz = fit("Formatting.", 220, W - 120, 700, -0.04);
          setFont(sz, weight, DISPLAY, -0.04);
          ctx.textAlign = "center";
          const w = tw("Formatting.");
          const by = Y(660, CY + 100);
          if (st === 3) {
            ctx.fillStyle = C.white;
            ctx.fillRect(CX - w / 2 - 30, by - sz * 0.86, w + 60, sz * 1.14);
          }
          ctx.save();
          ctx.translate(CX, by);
          if (st === 1) ctx.transform(1, 0, -0.22, 1, 0, 0);
          ctx.fillStyle = st === 3 ? C.indigo : C.white;
          ctx.fillText("Formatting.", 0, 0);
          if (st === 2) ctx.fillRect(-w / 2, sz * 0.15, w, sz * 0.07);
          ctx.restore();
        } else if (k === 2) {
          bg(C.lav100);
          punch();
          const sz = fit("Copying.", 230, W - 220, 700, -0.04);
          const by = Y(660, CY + 80);
          setFont(sz, 700, DISPLAY, -0.04);
          ctx.textAlign = "center";
          const w = tw("Copying.");
          const drag = E.out(clamp(u / 0.4));
          ctx.globalAlpha = 0.22;
          ctx.fillStyle = C.indigo;
          ctx.fillText(
            "Copying.",
            CX + 70 + drag * (PORTRAIT ? 120 : 380),
            by + 60 + drag * 150,
          );
          ctx.globalAlpha = 1;
          ctx.fillStyle = C.ink;
          ctx.fillText("Copying.", CX, by);
          // marching ants: the copy selection everyone recognises
          const box = [CX - w / 2 - 50, by - sz * 0.96, w + 100, sz * 1.26];
          ctx.lineWidth = 6;
          ctx.setLineDash([22, 16]);
          ctx.strokeStyle = C.white;
          ctx.lineDashOffset = 0;
          ctx.strokeRect(...box);
          ctx.strokeStyle = C.indigo;
          ctx.lineDashOffset = -u * 260;
          ctx.strokeRect(...box);
          ctx.setLineDash([]);
        } else if (k === 3) {
          bg(C.paper);
          punch();
          const cols = [C.lav100, C.a200, C.lav, C.ink];
          const sz = fit("Pasting.", 230, W - 300, 700, -0.04);
          for (let i = 0; i < 4; i++) {
            const t0 = i * (BEAT / 4);
            if (u < t0) continue;
            const s = lerp(1.3, 1, E.expo(clamp((u - t0) / 0.09)));
            ctx.save();
            ctx.translate(CX + (i - 3) * (PORTRAIT ? 40 : 70), Y(560, CY) + (i - 3) * 60);
            ctx.scale(s, s);
            setFont(sz, 700, DISPLAY, -0.04);
            ctx.textAlign = "center";
            ctx.fillStyle = cols[i];
            ctx.fillText("Pasting.", 0, sz * 0.35);
            ctx.restore();
          }
        } else if (k === 4) {
          bg(C.ink);
          punch();
          const bar = {
            x: PORTRAIT ? 40 : 140,
            y: Y(220, CY - 520),
            w: W - (PORTRAIT ? 80 : 280),
          };
          ctx.fillStyle = C.ink2;
          ctx.strokeStyle = C.ink5;
          ctx.lineWidth = 2;
          rr(bar.x, bar.y, bar.w, 104, 16);
          ctx.fill();
          ctx.stroke();
          setFont(40, 600, BODY);
          ctx.fillStyle = C.lav;
          ctx.textAlign = "left";
          ctx.fillText("fx", bar.x + 40, bar.y + 66);
          ctx.fillStyle = C.ink5;
          ctx.fillRect(bar.x + 110, bar.y + 20, 2, 64);
          setFont(36, 500, BODY);
          const n = Math.floor(FORMULA.length * clamp(u / 0.38));
          const s = FORMULA.slice(0, n);
          ctx.save();
          ctx.beginPath();
          ctx.rect(bar.x + 130, bar.y, bar.w - 150, 104);
          ctx.clip();
          const over = Math.max(0, tw(s) - (bar.w - 190));
          ctx.fillStyle = C.white;
          ctx.fillText(s, bar.x + 140 - over, bar.y + 66);
          ctx.fillRect(bar.x + 142 - over + tw(s), bar.y + 32, 3, 44);
          ctx.restore();
          headline(
            "Building\nformulas.",
            Y(720, CY + 160),
            PORTRAIT ? 210 : 176,
            C.white,
          );
        } else if (k === 5) {
          bg(C.paper);
          punch();
          headline("Making\ncharts.", Y(300, CY - 440), PORTRAIT ? 220 : 180, C.ink);
          const r = rng(500 + Math.floor(u / (BEAT / 4)));
          const topple = clamp((u - (BEAT * 3) / 4) / (BEAT / 4));
          const base = Y(960, CY + 560);
          const x0 = CX - 440;
          for (let i = 0; i < 7; i++) {
            const h = 120 + r() * (PORTRAIT ? 560 : 420);
            const x = x0 + i * 130;
            ctx.save();
            ctx.translate(x + (i % 2 ? 96 : 0), base);
            ctx.rotate((i % 2 ? 1 : -1) * E.in3(topple) * (0.7 + i * 0.06));
            ctx.fillStyle = i === 4 ? C.indigo : C.a200;
            rr(i % 2 ? -96 : 0, -h, 96, h, 10);
            ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = C.n400;
          ctx.fillRect(x0 - 40, base, 960, 4);
        } else if (k === 6) {
          bg(C.neg);
          punch();
          ERRORS.forEach((e, i) => {
            const t0 = (i * BEAT) / 8;
            if (u < t0) return;
            const s = E.back(clamp((u - t0) / 0.12));
            const a = ERROR_AT[i];
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rot);
            ctx.scale(s, s);
            setFont(40, 700, BODY);
            const w = tw(e) + 48;
            ctx.fillStyle = C.white;
            rr(-w / 2, -38, w, 76, 14);
            ctx.fill();
            ctx.fillStyle = C.neg;
            ctx.textAlign = "center";
            ctx.fillText(e, 0, 14);
            ctx.restore();
          });
          headline("Fixing\nthem", Y(620, CY + 80), PORTRAIT ? 250 : 210, C.white);
        } else {
          const j = clamp(Math.floor(u / (BEAT / 4)), 0, 3);
          const bgs = [C.ink, C.neg, C.paper, C.indigo];
          const fgs = [C.white, C.white, C.ink, C.white];
          const sizes = PORTRAIT ? [210, 290, 170, 320] : [230, 330, 190, 400];
          const offs = PORTRAIT
            ? [
                [-100, -360],
                [60, 160],
                [-40, 520],
                [0, 0],
              ]
            : [
                [-240, -120],
                [160, 60],
                [-60, 220],
                [0, 0],
              ];
          bg(bgs[j]);
          const sh = shake(t, [b(27.75)], 22, 7);
          cam(
            CX - sh.x,
            CY - sh.y,
            1 + 0.1 * (1 - E.expo(clamp((u - j * (BEAT / 4)) / 0.1))),
          );
          setFont(sizes[j], 700, DISPLAY, -0.045);
          ctx.textAlign = "center";
          ctx.fillStyle = fgs[j];
          ctx.fillText("again.", CX + offs[j][0], CY + 80 + offs[j][1]);
        }
        reset();
      }

      /* ================================================================ 5 · the turn
       * 28 → 36 beats. "What if you could just upload your data… …and get your MIS back?"
       * The music drops away; paper, and calm. Files fall into "Add a file", the bar fills,
       * the card turns indigo and the camera dives into it. */

      const DROP = PORTRAIT
        ? { x: CX - 260, y: 1010, w: 520, h: 600 }
        : { x: 1300, y: 250, w: 480, h: 540 };
      const DROP_FILES = [
        { name: "Trial balance — Mar.xlsx", rot: -0.06 },
        { name: "Sales register.xlsx", rot: 0.045 },
        { name: "Ledger export.xlsx", rot: -0.015 },
      ];

      function s5(t) {
        bg(C.paper);
        const dive = E.inexpo(clamp((t - b(35.25)) / b(0.75)));
        const cx = DROP.x + DROP.w / 2;
        const cy = DROP.y + DROP.h / 2;
        const push = 1 + 0.07 * E.inout(clamp((t - b(28)) / b(7)));
        const z = push * Math.exp(Math.log(60) * dive);
        cam(lerp(CX, cx, Math.min(1, dive * 3)), lerp(CY, cy, Math.min(1, dive * 3)), z);
        dotGrid(C.n400, 0.3, 32, 400);

        const x = M;
        const y = PORTRAIT ? [320, 470, 610, 750] : [300, 450, 630, 790];
        const big = PORTRAIT ? 100 : 116;
        words(
          at(["What", "if", "you", "could", "just"], 28, 0.25),
          x,
          y[0],
          PORTRAIT ? 68 : 72,
          t,
          { weight: 500 },
        );
        words(
          at([{ s: "upload", color: C.indigo }, "your", "data…"], 29.5, 0.5),
          x,
          y[1],
          big,
          t,
        );
        words(at(["…and", "get", "your"], 32, 0.25), x, y[2], big, t);
        words(at([{ s: "MIS", color: C.indigo }, "back?"], 33, 0.5), x, y[3], big, t, {
          weight: 700,
        });

        // the card
        const filled = clamp((t - b(35)) / b(0.25));
        const appear = E.back(clamp((t - b(29.5)) / 0.4));
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(appear, appear);
        ctx.translate(-cx, -cy);
        ctx.fillStyle = mix(C.white, C.indigo, filled);
        rr(DROP.x, DROP.y, DROP.w, DROP.h, 36);
        ctx.fill();
        const landed = t >= b(30) + 0.3;
        ctx.lineWidth = 4;
        ctx.strokeStyle = landed ? C.indigo : C.n400;
        if (!landed) ctx.setLineDash([16, 12]);
        ctx.stroke();
        ctx.setLineDash([]);
        if (filled < 1) {
          ctx.globalAlpha = 1 - filled;
          ctx.fillStyle = C.lav50;
          circle(cx, DROP.y + 120, 64);
          ctx.strokeStyle = C.indigo;
          ctx.lineWidth = 9;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(cx, DROP.y + 150);
          ctx.lineTo(cx, DROP.y + 88);
          ctx.moveTo(cx - 24, DROP.y + 112);
          ctx.lineTo(cx, DROP.y + 88);
          ctx.lineTo(cx + 24, DROP.y + 112);
          ctx.stroke();
          setFont(42, 600);
          ctx.fillStyle = C.ink;
          ctx.textAlign = "center";
          ctx.fillText("Add a file", cx, DROP.y + 238);
          setFont(24, 500, BODY);
          ctx.fillStyle = C.n500;
          ctx.fillText("Trial balance, ledgers, registers", cx, DROP.y + 278);
          // the progress bar
          const prog = E.inout(clamp((t - b(31.5)) / b(3.5)));
          ctx.fillStyle = C.n100;
          rr(DROP.x + 50, DROP.y + DROP.h - 60, DROP.w - 100, 12, 6);
          ctx.fill();
          if (prog > 0) {
            ctx.fillStyle = C.indigo;
            rr(DROP.x + 50, DROP.y + DROP.h - 60, (DROP.w - 100) * prog, 12, 6);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }
        // files falling in, one an eighth note after another
        DROP_FILES.forEach((f, i) => {
          const t0 = b(30 + i * 0.5);
          if (t < t0 || filled >= 1) return;
          const p = E.bounce(clamp((t - t0) / 0.42));
          const yy = lerp(-140, DROP.y + DROP.h - 136 - i * 20, p);
          ctx.save();
          ctx.globalAlpha = 1 - filled;
          ctx.translate(cx, yy);
          ctx.rotate(f.rot * p);
          ctx.fillStyle = C.white;
          ctx.strokeStyle = C.n200;
          ctx.lineWidth = 2;
          rr(-180, -36, 360, 72, 14);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = C.indigo;
          rr(-164, -22, 44, 44, 10);
          ctx.fill();
          ctx.fillStyle = C.white;
          for (let k = 0; k < 3; k++) ctx.fillRect(-154, -12 + k * 10, 24, 4);
          setFont(22, 600, BODY);
          ctx.fillStyle = C.n900;
          ctx.textAlign = "left";
          ctx.fillText(f.name, -104, 8);
          ctx.restore();
        });
        ctx.restore();
        reset();
      }

      /* ================================================================ 6 · the payoff
       * 36 → 52 beats. "A clean dashboard. Key business insights. Charts that actually make
       * sense. And a report ready to share."
       * The drop. A dashboard flies in from an isometric plane and settles flat; the camera
       * visits the figures, the commentary and the charts on the beat; then the board turns
       * over into the workbook's pages. In portrait the board stacks: figures two by two,
       * the chart, then the margin line beside what moved. */

      const DL = PORTRAIT
        ? {
            px: 60,
            py: 250,
            pw: 960,
            ph: 1316,
            kpi: (i) => ({
              x: 30 + (i % 2) * 460,
              y: 86 + Math.floor(i / 2) * 180,
              w: 440,
              h: 160,
            }),
            bar: { x: 30, y: 446, w: 900, h: 520 },
            line: { x: 30, y: 986, w: 440, h: 300 },
            ins: { x: 490, y: 986, w: 440, h: 300 },
          }
        : {
            px: 210,
            py: 120,
            pw: 1500,
            ph: 840,
            kpi: (i) => ({ x: 30 + i * 365, y: 86, w: 345, h: 160 }),
            bar: { x: 30, y: 266, w: 900, h: 544 },
            line: { x: 950, y: 266, w: 520, h: 262 },
            ins: { x: 950, y: 548, w: 520, h: 262 },
          };
      const KPI = [
        { label: "Revenue", value: "$452.2K", delta: "▲ 14.6%", up: true },
        { label: "Gross margin", value: "41.6%", delta: "▲ 2.1 pts", up: true },

      const INSIGHTS = [

      const CAPTIONS = [
        { at: 37, s: "A clean dashboard." },

      /** The world point at the centre of one of the board's cards. */
      const centre = (r) => ({ x: DL.px + r.x + r.w / 2, y: DL.py + r.y + r.h / 2 });
      const CAM6 = PORTRAIT
        ? [
            { at: 40, dur: 0.8, x: CX, y: DL.py + 256, z: 1.12 },
            { at: 42, dur: 0.6, ...centre(DL.ins), z: 2.0 },
            { at: 44, dur: 0.36, ...centre(DL.bar), z: 1.15, ease: E.expo },
            { at: 46, dur: 0.6, ...centre(DL.line), z: 2.0 },

          ]
        : [
            { at: 40, dur: 0.8, x: 870, y: 300, z: 1.55 },
            { at: 42, dur: 0.6, x: 1420, y: 800, z: 1.85 },
            { at: 44, dur: 0.36, x: 700, y: 660, z: 1.55, ease: E.expo },
            { at: 46, dur: 0.6, x: 1420, y: 520, z: 1.95 },
            { at: 48, dur: 0.7, x: 960, y: 600, z: 0.9 },
          ];
      function cam6(t) {
        let s = { x: CX, y: CY, z: 1 };
        for (const m of CAM6) {
          if (t < b(m.at)) break;
          const p = (m.ease ?? E.inout)(clamp((t - b(m.at)) / b(m.dur)));
          s = {
            x: lerp(s.x, m.x, p),
            y: lerp(s.y, m.y, p),
            z: Math.exp(lerp(Math.log(s.z), Math.log(m.z), p)),
          };
        }
        return s;
      }

      /** Digits that roll into place, each column a reel, the figures at fixed widths. */
      function rolling(str, x, y, size, t, t0) {
        setFont(size, 700, BODY);
        ctx.textAlign = "left";
        const dw = cw("0");
        let cx = x;
        let di = 0;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 4, y - size * 0.95, tabWidth(str) + 8, size * 1.2);
        ctx.clip();
        for (const ch of str) {
          if (isDigit(ch)) {
            const target = Number(ch);
            const p = E.out5(clamp((t - t0 - di * 0.045) / 0.9));
            const pos = (target + 10 * (2 + di)) * p;
            const lo = Math.floor(pos);
            const frac = pos - lo;
            for (let k = 0; k < 2; k++) {
              const d = (lo + k) % 10;
              ctx.fillText(
                String(d),
                cx + (dw - cw(String(d))) / 2,
                y + (k - frac) * size * 1.1,
              );
            }
            cx += dw;
            di++;
          } else {
            ctx.fillText(ch, cx, y);
            cx += cw(ch);
          }
        }
        ctx.restore();
      }

      function card(r, t, t0) {
        const p = E.out(clamp((t - t0) / 0.3));
        ctx.globalAlpha = p;
        ctx.translate(0, (1 - p) * 40);
        ctx.fillStyle = C.white;
        ctx.strokeStyle = C.n200;
        ctx.lineWidth = 2;
        rr(r.x, r.y, r.w, r.h, 20);
        ctx.fill();
        ctx.stroke();
        return p;
      }
      function cardTitle(r, s) {
        setFont(24, 600, BODY);
        ctx.fillStyle = C.ink;
        ctx.textAlign = "left";
        ctx.fillText(s, r.x + 28, r.y + 46);
      }

      function barChart(r, t, T0) {
        cardTitle(r, "Revenue by month");
        setFont(17, 500, BODY);
        ctx.fillStyle = C.n400;
        ctx.fillText("$K", r.x + 28, r.y + 74);
        const base = r.y + r.h - 60;
        const top = r.y + 114;
        const step = (r.w - 130) / 12;
        ctx.strokeStyle = C.n100;
        ctx.lineWidth = 2;
        for (let g = 0; g <= 3; g++) {
          const gy = base - ((base - top) * g) / 3;
          ctx.beginPath();
          ctx.moveTo(r.x + 80, gy);
          ctx.lineTo(r.x + r.w - 30, gy);
          ctx.stroke();
          tab(String(g * 150), r.x + 66, gy + 6);
        }
        REVENUE.forEach((v, i) => {
          const grow = E.back(clamp((t - T0 - b(0.5) - b(0.0625) * i) / 0.4));
          const wave = 1 - 0.55 * bump(t, b(44.25) + b(0.125) * i, b(0.5));
          const h = ((base - top) * v * grow * wave) / 470;
          const bx = r.x + 100 + i * step;
          ctx.fillStyle = i === REVENUE.length - 1 && t >= b(45) ? C.indigo : C.a200;
          rr(bx, base - h, step * 0.69, h, [8, 8, 0, 0]);
          ctx.fill();
          ctx.fillStyle = C.n400;
          ctx.textAlign = "center";
          ctx.fillText(MONTHS[i], bx + step * 0.345, base + 30);
          ctx.textAlign = "left";
        });
        const chip = E.back(clamp((t - b(45)) / 0.3));
        if (chip > 0) {
          ctx.save();
          ctx.translate(
            r.x + 100 + 11 * step + step * 0.345,
            base - (base - top) * (452 / 470) - 34,
          );
          ctx.scale(chip, chip);
          ctx.translate(-58, 0);
          pill("$452K", 0, 0, 18, C.white, C.indigo);
          ctx.restore();
        }
      }

      function lineChart(r, t, T0) {
        cardTitle(r, "Gross margin");
        const base = r.y + r.h - 40;
        const top = r.y + 100;
        const px = (i) => r.x + 40 + (i * (r.w - 80)) / 11;
        const py = (v) => base - ((v - 35) / 7.5) * (base - top);
        const draw =
          t < b(46.25)
            ? clamp((t - T0 - b(0.75)) / 0.8)
            : E.inout(clamp((t - b(46.25)) / b(1)));
        ctx.strokeStyle = C.n100;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(r.x + 30, base);
        ctx.lineTo(r.x + r.w - 30, base);
        ctx.stroke();
        const n = (MARGIN.length - 1) * draw;
        ctx.strokeStyle = C.indigo;
        ctx.lineWidth = 5;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        for (let i = 0; i <= Math.floor(n); i++)
          i === 0 ? ctx.moveTo(px(i), py(MARGIN[i])) : ctx.lineTo(px(i), py(MARGIN[i]));
        const f = n - Math.floor(n);
        const i0 = Math.floor(n);
        if (i0 < MARGIN.length - 1 && f > 0)
          ctx.lineTo(
            lerp(px(i0), px(i0 + 1), f),
            lerp(py(MARGIN[i0]), py(MARGIN[i0 + 1]), f),
          );
        ctx.stroke();
        const ring = E.back(clamp((t - b(47.25)) / 0.3));
        if (ring > 0) {
          const ex = px(11);
          const ey = py(41.6);
          ctx.fillStyle = C.indigo;
          circle(ex, ey, 12 * ring);
          ctx.fillStyle = C.white;
          circle(ex, ey, 5 * ring);
          ctx.save();
          ctx.translate(ex - 50, ey - 40);
          ctx.scale(ring, ring);
          pill("41.6%", 0, 0, 17, C.white, C.indigo);
          ctx.restore();
        }
      }

      function insights(r, t) {
        cardTitle(r, "What moved");
        INSIGHTS.forEach((parts, i) => {
          const y = r.y + 104 + i * 52;
          const t0 = b(42.5 + i * 0.5);
          ctx.fillStyle = C.indigo;
          circle(r.x + 36, y - 7, 6);
          if (t < t0) {
            ctx.fillStyle = C.n100;
            rr(r.x + 54, y - 18, Math.min(300 - i * 50, r.w - 100), 18, 9);
            ctx.fill();
            return;
          }
          const fs = PORTRAIT ? 21 : 23;
          setFont(fs, 700, BODY);
          const w1 = tw(parts[1]);
          setFont(fs, 500, BODY);
          const w0 = tw(parts[0]);
          const full = w0 + w1 + 2 + tw(parts[2]);

          const hl = E.inout(clamp((t - t0 - 0.2) / 0.25));
          ctx.fillStyle = C.lav100;

          ctx.fill();

          ctx.beginPath();

          ctx.clip();
          ctx.fillStyle = C.n900;
          ctx.fillText(parts[0], r.x + 56, y);
          ctx.fillStyle = C.indigo;
          setFont(fs, 700, BODY);
          ctx.fillText(parts[1], r.x + 56 + w0, y);
          setFont(fs, 500, BODY);
          ctx.fillStyle = C.n900;
          ctx.fillText(parts[2], r.x + 58 + w0 + w1, y);

      function dashboard(t) {

        ctx.fill();

        ctx.textAlign = "left";

        ctx.save();
        if (card(DL.line, t, T0 + b(0.625)) > 0) lineChart(DL.line, t, T0);
        ctx.restore();
        ctx.save();
        if (card(DL.ins, t, T0 + b(0.75)) > 0) insights(DL.ins, t);

      const PAGES = [
        {
          title: "Profit and loss",
          rows: [
            ["Revenue", "452,180"],
            ["Direct costs", "(264,090)"],
            ["Gross profit", "188,090"],
            ["Employee costs", "(71,300)"],

            ["Receivables", "621,900"],
            ["Cash", "1,370,200"],

            ["Net worth", "2,889,890"],
          ],
        },
        {
          title: "Cash flow",
          rows: [
            ["Operating", "94,310"],
            ["Investing", "(61,800)"],
            ["Financing", "(77,900)"],

          title: "Ratios",
          rows: [
            ["Gross margin", "41.6%"],

            ["Debtor days", "41"],
            ["Creditor days", "46"],
            ["Current ratio", "2.1"],
            ["Stock days", "44"],
          ],
        },
      ];
      function page(pg) {
        ctx.fillStyle = C.white;
        rr(-240, -320, 480, 640, 18);
        ctx.fill();
        ctx.fillStyle = C.indigo;
        ctx.fillRect(-240, -302, 8, 64);
        setFont(34, 600);
        ctx.fillStyle = C.ink;
        ctx.textAlign = "left";
        ctx.fillText(pg.title, -200, -258);
        setFont(17, 500, BODY);
        ctx.fillStyle = C.n400;
        ctx.fillText("Northwind Traders · March 2026 · $", -200, -224);
        pg.rows.forEach(([l, v], i) => {
          const y = -150 + i * 64;
          const strong = i === pg.rows.length - 1;
          ctx.fillStyle = C.n100;
          ctx.fillRect(-200, y + 22, 400, 2);
          setFont(21, strong ? 700 : 500, BODY);
          ctx.fillStyle = strong ? C.ink : C.n700;
          ctx.textAlign = "left";
          ctx.fillText(l, -200, y);
          ctx.fillStyle = C.n900;
