<!-- SPEC §29: plain, branded, no financial figures. Token-hash link so verification works
     in any browser, not only the one holding a PKCE verifier cookie. -->
<h2>Confirm your email address</h2>
<p>Open this link to confirm the email address for your account:</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email&next=/sign-in/verified"
    >Confirm email address</a
  >
</p>
<p>If you did not create an account, you can ignore this email.</p>
