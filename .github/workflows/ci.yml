name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let a CI run reach a real Anthropic, Razorpay or Supabase account.
  CI: "true"

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Single source of truth: the packageManager field in package.json.
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if the lockfile and manifests disagree, so a
        # dependency can never be added without committing the lockfile (SPEC §30).
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The db suite boots Postgres 17 through Testcontainers. Pre-pulling here keeps
      # the image fetch out of the per-suite timeout and makes a registry failure
      # legible as its own step rather than a mysterious test timeout.
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine
          docker pull testcontainers/ryuk:0.14.0

      - name: Test
        run: pnpm test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        # SPEC §30 requires dependency scanning. Fails the job on a high or critical
        # advisory; moderate and below are reported without blocking a merge.
        run: pnpm audit --audit-level high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
