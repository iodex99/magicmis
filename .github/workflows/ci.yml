name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let a CI run reach a real Anthropic, Razorpay or Supabase account.
  CI: "true"

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Single source of truth: the packageManager field in package.json.
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if the lockfile and manifests disagree, so a
        # dependency can never be added without committing the lockfile (SPEC §30).
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The db suite boots Postgres 17 through Testcontainers. Pre-pulling here keeps
      # the image fetch out of the per-suite timeout and makes a registry failure
      # legible as its own step rather than a mysterious test timeout.
      - name: Pre-pull test images
        run: |
          docker pull postgres:17-alpine
          docker pull testcontainers/ryuk:0.14.0

      - name: Test
        run: pnpm test

  e2e:
    name: end-to-end (Supabase local + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check supabase/migrations mirrors packages/db
        run: node scripts/sync-supabase-migrations.mjs --check

      # Storage, image proxy and realtime are not used before Phase 6 and add minutes of
      # image pulls; excluded so the job measures the product, not the registry.
      - name: Start Supabase local stack
        run: npx supabase start -x storage-api,imgproxy,realtime

      - name: Write app environment from the running stack
        run: |
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          # Throwaway values generated per run: never committed (gitleaks), and 48 characters so the
          # client bundle scan checks each one by value (scan-client-bundles.mjs).
          rand() { node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"; }
          cat > apps/web/.env.local <<EOF
          NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL=${API_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}
          NEXT_PUBLIC_ENVIRONMENT=development
          DATABASE_URL=${DB_URL}
          SUPABASE_SECRET_KEY=${SECRET_KEY}
          ANTHROPIC_API_KEY=ci-$(rand)
          RAZORPAY_KEY_ID=rzp_test_ci
          RAZORPAY_KEY_SECRET=ci-$(rand)
          RAZORPAY_WEBHOOK_SECRET=ci-$(rand)
          KMS_MASTER_KEY_ID=alias/magicmis-ci
          AWS_REGION=ap-south-1
          RESEND_API_KEY=re_ci_$(rand)
          EMAIL_FROM=CI <noreply@ci.test>
          EOF
          cat > apps/admin/.env.local <<EOF
          APP_ENVIRONMENT=development
          DATABASE_URL=${DB_URL}
          ADMIN_ALLOWED_EMAILS=admin@example.test
          KEY_WRAPPER=local
          LOCAL_MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
          EOF

      - name: Build web and admin apps
        run: pnpm --filter @magicmis/web --filter @magicmis/admin build

      # SPEC §30 / §2.9: no server secret or server-only module may reach a browser bundle.
      - name: Scan client bundles for secrets
        run: node scripts/scan-client-bundles.mjs --env-file apps/web/.env.local --env-file apps/admin/.env.local

      - name: Install Chromium
        run: pnpm --filter @magicmis/web exec playwright install --with-deps chromium

      - name: Run E2E
        run: |
          pnpm --filter @magicmis/web e2e
          pnpm --filter @magicmis/admin e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/admin/test-results
          retention-days: 7

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        # SPEC §30 requires dependency scanning. Fails the job on a high or critical
        # advisory; moderate and below are reported without blocking a merge.
        run: pnpm audit --audit-level high

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
